agent = "gemini"
review_agent = "gemini"
review_reasoning = "thorough"
default_branch = "main"

exclude_patterns = [
  "*.sum",
  "*.lock",
  "package-lock.json",
  "pnpm-lock.yaml"
]

review_guidelines = """
Repository Scope: azylman/mirrormere (smart display kiosk UI, frontend dashboard widgets, and display/audio hardware integration).
Repo-Specific Invariants (appended to global Aerial cluster guidelines in ~/.roborev/config.toml):
1. Zero Personal Data & Sensitive Identifiers: Never allow personal names, Discord handles, home addresses, or private entity IDs in this generic open-source repository (repository maintainer/collaborator GitHub logins `azylman`, `mcarmody`, and `brockventures` in `.github/workflows/*.yml` CI actor allowlists are expected and permitted).
2. Frontend & Hardware Resource Hygiene: Ensure WebSocket/SSE streams, WebRTC/audio pipelines, timers, and DOM event listeners are cleanly disposed on unmount/disconnect, and maintain touch/e-ink display responsiveness.
"""

[ci]
agents = ["gemini"]
review_types = ["default"]
reasoning = "thorough"
min_severity = "medium"
upsert_comments = true
