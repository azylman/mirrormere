<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New on Plex</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --text-main: #f8fafc;
    --text-sub: rgba(226, 232, 240, 0.72);
    --card-bg: rgba(30, 41, 59, 0.55);
    --pill-bg: rgba(255, 255, 255, 0.08);
    --pill-active: #e5a00d;
    --modal-bg: rgba(15, 23, 42, 0.96);
  }
  body.theme-day {
    --text-main: #1e293b;
    --text-sub: #64748b;
    --card-bg: rgba(255, 255, 255, 0.72);
    --pill-bg: rgba(15, 23, 42, 0.07);
    --modal-bg: rgba(248, 250, 252, 0.97);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: transparent;
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 8px 12px 10px;
    user-select: none;
    position: relative;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .tabs {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    border: 0;
    background: var(--pill-bg);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.73rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--pill-active);
    color: #0f172a;
  }
  .req-open-btn {
    border: 0;
    background: #6366f1;
    color: #ffffff;
    font-family: inherit;
    font-size: 0.73rem;
    font-weight: 800;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .poster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 9px;
    overflow-y: auto;
    padding-right: 4px;
    flex: 1;
  }
  .poster-grid::-webkit-scrollbar { width: 5px; }
  .poster-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 99px; }
  .item-card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .item-card:active { transform: scale(0.96); }
  .poster-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    background: rgba(15, 23, 42, 0.6);
    overflow: hidden;
  }
  .poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .type-pill {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(15, 23, 42, 0.84);
    color: #f8fafc;
    font-size: 0.60rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    text-transform: uppercase;
  }
  .rating-pill {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(229, 160, 13, 0.92);
    color: #0f172a;
    font-size: 0.62rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .meta {
    padding: 6px 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title {
    font-size: 0.74rem;
    font-weight: 800;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Modals */
  .overlay-modal {
    position: fixed;
    inset: 0;
    background: var(--modal-bg);
    z-index: 50;
    display: none;
    flex-direction: column;
    padding: 12px 14px;
  }
  .overlay-modal.open { display: flex; }
  .seerr-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .seerr-input {
    flex: 1;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(15, 23, 42, 0.35);
    color: var(--text-main);
    padding: 7px 14px;
    font-family: inherit;
    font-size: 0.82rem;
    outline: none;
  }
  body.theme-day .seerr-input {
    background: #ffffff;
    color: #0f172a;
  }
  .seerr-btn {
    border: 0;
    border-radius: 999px;
    padding: 6px 13px;
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 800;
    cursor: pointer;
    background: #6366f1;
    color: #fff;
  }
  .seerr-close {
    background: var(--pill-bg);
    color: var(--text-main);
  }
  .req-action-btn {
    margin-top: 4px;
    border: 0;
    border-radius: 6px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 0.66rem;
    font-weight: 800;
    cursor: pointer;
    background: #6366f1;
    color: #fff;
  }
  .req-action-btn[disabled] {
    background: rgba(16, 185, 129, 0.22);
    color: #10b981;
    cursor: default;
  }
  /* Detail Popover Layout */
  .detail-content {
    display: flex;
    gap: 14px;
    flex: 1;
    overflow: hidden;
    align-items: flex-start;
  }
  .detail-poster {
    width: 120px;
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(15, 23, 42, 0.5);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .detail-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    height: 100%;
    overflow: hidden;
  }
  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .detail-title {
    font-size: 1.02rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .detail-sub {
    font-size: 0.78rem;
    font-weight: 700;
    color: #e5a00d;
  }
  .detail-summary {
    font-size: 0.78rem;
    line-height: 1.42;
    color: var(--text-sub);
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
  }
  .detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .tv-play-btn {
    border: 0;
    border-radius: 999px;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 0.80rem;
    font-weight: 800;
    cursor: pointer;
    background: #e5a00d;
    color: #0f172a;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tv-play-btn[disabled] {
    background: rgba(16, 185, 129, 0.25);
    color: #10b981;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" data-cat="all">All Recent</button>
      <button class="tab-btn" data-cat="movie">Movies</button>
      <button class="tab-btn" data-cat="tv">TV Shows</button>
      <button class="tab-btn" data-cat="audiobook">Audiobooks</button>
      <button class="tab-btn" data-cat="upcoming">Dropping Soon</button>
    </div>
    <button class="req-open-btn" id="open-seerr-btn">+ Request</button>
  </div>
  <div class="poster-grid" id="poster-grid"></div>

  <!-- Detail Popover + Play on Living Room TV -->
  <div class="overlay-modal" id="detail-modal">
    <div class="detail-content">
      <img class="detail-poster" id="detail-poster" src="" alt="">
      <div class="detail-info">
        <div class="detail-header">
          <div>
            <div class="detail-title" id="detail-title"></div>
            <div class="detail-sub" id="detail-sub"></div>
          </div>
          <button type="button" class="seerr-btn seerr-close" id="close-detail-btn">✕</button>
        </div>
        <div class="detail-summary" id="detail-summary"></div>
        <div class="detail-actions">
          <button type="button" class="tv-play-btn" id="tv-play-btn">📺 Play on Living Room TV</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Seerr Request Modal -->
  <div class="overlay-modal" id="seerr-modal">
    <form class="seerr-bar" id="seerr-form">
      <input type="text" class="seerr-input" id="seerr-input" placeholder="Search Seerr for a movie or TV show..." autocomplete="off">
      <button type="submit" class="seerr-btn">Search</button>
      <button type="button" class="seerr-btn seerr-close" id="close-seerr-btn">Close</button>
    </form>
    <div class="poster-grid" id="seerr-results"></div>
  </div>

<script>
  let recentItems = [];
  let upcomingItems = [];
  let currentList = [];
  let activeCat = 'all';
  let selectedItem = null;

  function escHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function syncTheme() {
    try {
      const parentTheme = window.parent && window.parent.document && window.parent.document.documentElement.getAttribute('data-theme');
      document.body.classList.toggle('theme-day', parentTheme === 'day');
    } catch (_) {}
  }
  syncTheme();
  setInterval(syncTheme, 5000);

  function render() {
    const grid = document.getElementById('poster-grid');
    if (activeCat === 'upcoming') {
      currentList = upcomingItems;
    } else if (activeCat === 'all') {
      currentList = recentItems;
    } else {
      currentList = recentItems.filter(i => i.category === activeCat);
    }
    grid.innerHTML = currentList.map((item, idx) => {
      const badge = escHtml(item.badge || (item.category === 'audiobook' ? 'BOOK' : (item.category === 'tv' ? 'TV' : 'MOVIE')));
      const rating = item.rating ? `<span class="rating-pill">★ ${Number(item.rating).toFixed(1)}</span>` : '';
      return `
        <div class="item-card" data-idx="${idx}">
          <div class="poster-wrap">
            ${item.thumb ? `<img src="${escHtml(item.thumb)}" loading="lazy" alt="">` : ''}
            <span class="type-pill">${badge}</span>
            ${rating}
          </div>
          <div class="meta">
            <div class="title">${escHtml(item.title)}</div>
            <div class="sub">${escHtml(item.subtitle || '')}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('poster-grid').addEventListener('click', (e) => {
    const card = e.target.closest('.item-card[data-idx]');
    if (!card) return;
    const item = currentList[Number(card.dataset.idx)];
    if (!item) return;
    selectedItem = item;
    document.getElementById('detail-poster').src = item.thumb || '';
    document.getElementById('detail-title').textContent = item.title || 'Untitled';
    const ratingTxt = item.rating ? ` · ★ ${Number(item.rating).toFixed(1)}` : '';
    document.getElementById('detail-sub').textContent = (item.subtitle || item.year || '') + ratingTxt;
    document.getElementById('detail-summary').textContent = item.summary || 'No summary available.';
    const playBtn = document.getElementById('tv-play-btn');
    if (item.category === 'upcoming' || item.category === 'audiobook') {
      playBtn.style.display = 'none';
    } else {
      playBtn.style.display = 'inline-flex';
      playBtn.disabled = false;
      playBtn.textContent = '📺 Play on Living Room TV';
    }
    document.getElementById('detail-modal').classList.add('open');
  });

  document.getElementById('close-detail-btn').addEventListener('click', () => {
    document.getElementById('detail-modal').classList.remove('open');
  });

  document.getElementById('tv-play-btn').addEventListener('click', async () => {
    if (!selectedItem) return;
    const btn = document.getElementById('tv-play-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Waking Living Room TV...';
    try {
      const r = await fetch('/hearth-api/plex/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          rating_key: selectedItem.id,
          title: selectedItem.title,
          type: selectedItem.type || selectedItem.category,
        }),
      });
      const res = await r.json();
      btn.textContent = res.ok ? '✓ Launching on Living Room TV' : '⚠️ Launch Error';
    } catch (_) {
      btn.textContent = '⚠️ Launch Error';
    }
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      render();
    });
  });

  async function loadAll() {
    try {
      const [r1, r2] = await Promise.all([
        fetch('/hearth-api/plex/recent').then(r => r.json()).catch(() => ({items: []})),
        fetch('/hearth-api/plex/upcoming').then(r => r.json()).catch(() => ({items: []})),
      ]);
      recentItems = r1.items || [];
      upcomingItems = r2.items || [];
      render();
    } catch (_) {}
  }
  loadAll();
  setInterval(loadAll, 180000);

  // Seerr modal handlers
  const modal = document.getElementById('seerr-modal');
  const input = document.getElementById('seerr-input');
  const resultsEl = document.getElementById('seerr-results');

  document.getElementById('open-seerr-btn').addEventListener('click', () => {
    modal.classList.add('open');
    setTimeout(() => input.focus(), 50);
  });
  document.getElementById('close-seerr-btn').addEventListener('click', () => {
    modal.classList.remove('open');
  });

  document.getElementById('seerr-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    resultsEl.innerHTML = '<div style="font-size:0.8rem;opacity:0.7;">Searching Seerr...</div>';
    try {
      const r = await fetch('/hearth-api/seerr/search?q=' + encodeURIComponent(q));
      const data = await r.json();
      const items = data.items || [];
      resultsEl.innerHTML = items.map(item => {
        const isDone = item.status === 'available' || item.status === 'requested';
        const btnLabel = item.status === 'available' ? '✓ In Plex' : (item.status === 'requested' ? '✓ Requested' : '+ Request');
        return `
          <div class="item-card">
            <div class="poster-wrap">
              ${item.thumb ? `<img src="${escHtml(item.thumb)}" loading="lazy" alt="">` : ''}
              <span class="type-pill">${escHtml((item.media_type || '').toUpperCase())}</span>
            </div>
            <div class="meta">
              <div class="title">${escHtml(item.title)}</div>
              <div class="sub">${escHtml(item.year || '')}</div>
              <button class="req-action-btn" data-type="${escHtml(item.media_type)}" data-id="${escHtml(item.tmdb_id)}" ${isDone ? 'disabled' : ''}>${escHtml(btnLabel)}</button>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      resultsEl.innerHTML = '<div style="font-size:0.8rem;color:#ef4444;">Search failed</div>';
    }
  });

  resultsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.req-action-btn');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = 'Requesting...';
    try {
      const r = await fetch('/hearth-api/seerr/request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({media_type: btn.dataset.type, tmdb_id: Number(btn.dataset.id)}),
      });
      const res = await r.json();
      btn.textContent = res.ok ? '✓ Requested' : 'Error';
    } catch (_) {
      btn.textContent = 'Error';
    }
  });

  // Forward horizontal screen swipes to parent Hearth carousel
  let tsX = 0, tsY = 0, tsT = 0;
  document.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length === 1) {
      tsX = e.touches[0].clientX;
      tsY = e.touches[0].clientY;
      tsT = Date.now();
    }
  }, {passive: true});
  document.addEventListener('touchend', (e) => {
    if (!e.changedTouches || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    const dt = Date.now() - tsT;
    if (dt < 800 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      window.parent.postMessage({type: 'hearth-swipe', direction: dx < 0 ? 'next' : 'prev'}, '*');
    }
  }, {passive: true});
</script>
</body>
</html>
