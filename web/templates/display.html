<!DOCTYPE html>
<html lang="en" data-theme="{{ if .Theme }}{{ .Theme }}{{ else }}day{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="{{ if eq .Theme "night" }}#3b364c{{ else }}#f8f5ee{{ end }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mirrormere</title>
  <base href="./">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" id="hud-stylesheet" href="style.css">
</head>
<body data-timezone="{{ .Timezone }}" data-theme="{{ if .Theme }}{{ .Theme }}{{ else }}day{{ end }}"{{ if .HideCursor }} class="mm-touch-display"{{ end }}{{ if .RemoteURL }} data-remote-url="{{ .RemoteURL }}"{{ end }}{{ if and .VoiceWaveform .VoiceWaveform.Enabled }} data-voice-waveform-url="{{ .VoiceWaveform.LevelsURL }}" data-voice-waveform-gain="{{ .VoiceWaveform.Gain }}"{{ end }}>
  <div id="mirrormere-app" data-timezone="{{ .Timezone }}">
    <header class="header-zone">
      <div class="header-time-block">
        <div class="header-clock" id="header-clock" data-timezone="{{ .Timezone }}">--:--</div>
        <div class="header-date-stack" id="header-date-stack">
          <div class="header-date" id="header-date">------</div>
        </div>
      </div>
      <div class="header-next-event" id="header-next-event" style="display: none;">
        <div class="pill-badge next-event-pill" id="next-event-pill" role="button" tabindex="0" title="Next upcoming event">
          <span class="next-event-label" id="next-event-label">NEXT</span>
          <span class="next-event-time" id="next-event-time">--:--</span>
          <span class="next-event-title" id="next-event-title">--</span>
          <span class="next-event-countdown" id="next-event-countdown"></span>
        </div>
      </div>
      <div class="header-right-cluster">
        {{ if and .HeaderVideo .HeaderVideo.Enabled }}
        <div class="header-video" id="header-video">
          <button id="header-video-btn" class="header-video-btn" aria-label="Open Fullscreen Video" title="Open Fullscreen Video"{{ if .HeaderVideo.StreamID }} data-stream-id="{{ .HeaderVideo.StreamID }}"{{ end }}{{ if .HeaderVideo.StreamURL }} data-stream-url="{{ .HeaderVideo.StreamURL }}"{{ end }}{{ if .HeaderVideo.ControlURL }} data-control-url="{{ .HeaderVideo.ControlURL }}"{{ end }}{{ if .HeaderVideo.Type }} data-type="{{ .HeaderVideo.Type }}"{{ end }}>
            <svg class="header-video-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="15" x="2" y="7" rx="2" ry="2"></rect>
              <polyline points="17 2 12 7 7 2"></polyline>
            </svg>
            <span class="header-video-spinner" id="header-video-spinner" aria-hidden="true"></span>
          </button>
        </div>
        {{ end }}
        <div class="header-weather" id="header-weather">
          <div class="pill-badge weather-pill" id="weather-pill">
            <span class="weather-condition" id="weather-condition">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="mm-weather-icon mm-icon-weather-partly-cloudy"><circle cx="16" cy="9" r="4" fill="#f59e0b"/><g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"><line x1="16" y1="2" x2="16" y2="3.5"/><line x1="21.5" y1="6" x2="20" y2="7"/><line x1="21.5" y1="12" x2="20" y2="11"/><line x1="11.5" y1="4" x2="12.5" y2="5"/></g><path d="M15.5 19H7a4.5 4.5 0 0 1-.8-8.9A5.5 5.5 0 0 1 16.8 11 3.5 3.5 0 0 1 15.5 19z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
            <div class="weather-details" id="weather-details">
              <div class="weather-primary-row">
                <span class="weather-temp" id="weather-temp">--°</span>
                <span class="weather-location" id="weather-location">Oakland</span>
              </div>
              <span class="weather-desc" id="weather-desc">Sunny &amp; Mild</span>
            </div>
          </div>
        </div>
        <div class="header-theme-toggle" id="header-theme-toggle">
          <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Toggle Light/Dark Mode" title="Toggle Light / Dark Mode (Tap to cycle, Long-press for Auto)">
            <svg class="theme-icon theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5"></circle>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
              <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
              <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
            </svg>
            <svg class="theme-icon theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
        <div class="header-status" id="header-status" style="display: none;">
          <div class="status-jewel" title="System: Connected &amp; Synced">
            <span class="status-dot status-ok" id="system-status-dot"></span>
          </div>
        </div>
      </div>
      <div class="header-voice" id="header-voice">
        <div class="voice-indicator" id="voice-indicator">
          <span class="voice-pulse-ring" id="voice-pulse-ring"></span>
          <span class="voice-dot" id="voice-dot" style="display: none;"></span>
          <span class="voice-icon" id="voice-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mm-voice-icon-svg"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></span>
          <span class="voice-label" id="voice-label"></span>
        </div>
        <span class="voice-status" id="voice-status" style="display: none;"></span>
        <div class="voice-transcript" id="voice-transcript" style="display: none;"></div>
        <button id="header-voice-dismiss-btn" class="header-voice-dismiss" aria-label="Dismiss Voice" title="Dismiss Voice" onclick="window.MirrormereVoice &amp;&amp; window.MirrormereVoice.resetHUD &amp;&amp; window.MirrormereVoice.resetHUD()">✕</button>
        <div class="voice-audio-progress" id="voice-audio-progress" style="display: none;"></div>
      </div>
    </header>

    <main class="grid-canvas" id="grid-canvas" data-grid="{{ if .Grid }}{{ .Grid }}{{ else }}6x2{{ end }}">
      <!-- Active screen widgets mounted dynamically by carousel.js -->
    </main>

    <nav class="screen-indicator" id="screen-indicator" aria-label="Screen pagination" style="display: none;"></nav>
  </div>

  <div id="video-stage" class="video-stage" style="display: none;">
    <div id="video-primary-slot" class="video-primary-slot"></div>
    <div id="video-pip-slot" class="video-pip-slot" style="display: none;"></div>
    <div id="video-hud-overlay" class="video-hud-overlay">
      <div class="video-hud-header">
        <!-- Unified horizontal capsule in upper left: Back + Home -->
        <div class="video-hud-capsule-top-left video-hud-nav-bar" id="video-hud-nav-bar">
          <button id="video-hud-back-btn" class="video-hud-btn video-hud-nav-btn" aria-label="Back" title="Back">‹</button>
          <button id="video-hud-home-btn" class="video-hud-btn video-hud-nav-btn" aria-label="Home" title="Home">⌂</button>
        </div>
        <span id="video-hud-title" class="video-hud-title">Live Video</span>
        <!-- Unified vertical frosted pill in upper right: Dismiss + Volume + Mute -->
        <div class="video-hud-capsule-top-right video-hud-side-rail" id="video-hud-side-rail">
          <button id="video-hud-dismiss-btn" class="video-hud-btn video-hud-dismiss" aria-label="Dismiss Video" title="Dismiss Video">✕</button>
          <div class="video-hud-volume-container">
            <input type="range" id="video-hud-volume-slider" class="video-hud-volume-slider" min="0" max="100" value="75" aria-label="Master Volume">
          </div>
          <button id="video-hud-mute-btn" class="video-hud-btn video-hud-mute" aria-label="Mute / Unmute" title="Mute / Unmute">
            <span class="video-hud-icon" id="video-hud-mute-icon" data-icon="unmuted">🔊</span>
          </button>
        </div>
      </div>
      <button id="video-hud-play-btn" class="video-hud-btn video-hud-play video-hud-play-center" aria-label="Play / Pause" title="Play / Pause">
        <span class="video-hud-icon" id="video-hud-play-icon" data-icon="pause">⏸</span>
      </button>
      <div class="video-hud-controls video-hud-bottom-bar" id="video-hud-bottom-bar">
        <button id="video-hud-cc-btn" class="video-hud-btn video-hud-cc video-hud-media-btn" aria-label="Closed Captions" title="Closed Captions">CC</button>
        <button id="video-hud-prev-btn" class="video-hud-btn video-hud-prev video-hud-media-btn" aria-label="Previous Episode" title="Previous Episode">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="2.5" height="16" rx="1"></rect><polygon points="19 4 8.5 12 19 20"></polygon></svg>
        </button>
        <button id="video-hud-rewind-btn" class="video-hud-btn video-hud-skip video-hud-media-btn" aria-label="Rewind 10 Seconds" title="Rewind 10 Seconds">↺ 10s</button>
        <div class="video-hud-progress-container" id="video-hud-progress-container" style="display: none;">
          <span class="video-hud-time video-hud-time-current" id="video-hud-time-current">0:00</span>
          <div class="video-hud-progress-track" id="video-hud-progress-track">
            <div class="video-hud-progress-fill" id="video-hud-progress-fill" style="width: 0%;">
              <div class="video-hud-progress-thumb" id="video-hud-progress-thumb"></div>
            </div>
          </div>
          <span class="video-hud-time video-hud-time-total" id="video-hud-time-total">0:00</span>
        </div>
        <button id="video-hud-forward-btn" class="video-hud-btn video-hud-skip video-hud-media-btn" aria-label="Fast Forward 10 Seconds" title="Fast Forward 10 Seconds">↻ 10s</button>
        <button id="video-hud-next-btn" class="video-hud-btn video-hud-next video-hud-media-btn" aria-label="Next Episode" title="Next Episode">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><polygon points="5 4 15.5 12 5 20"></polygon><rect x="16.5" y="4" width="2.5" height="16" rx="1"></rect></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="voice-toast-dock" class="voice-toast-dock" aria-live="polite">
    <div id="voice-toast" class="voice-toast" style="display: none;">
      <span class="voice-toast-badge" id="voice-toast-badge" style="display: none;"></span>
      <span class="voice-toast-body" id="voice-toast-body"></span>
    </div>
  </div>

  <div id="mm-compositor-heartbeat" class="mm-compositor-heartbeat" aria-hidden="true"></div>

  {{ if .RemoteURL }}
  <script>
    window.MIRRORMERE_REMOTE_URL = {{ .RemoteURL }};
  </script>
  {{ end }}
  <script src="static/js/sse.js"></script>
  <script src="static/js/audio.js"></script>
  <script src="static/js/carousel.js"></script>
  <script src="static/js/video.js"></script>
  <script src="static/js/video_hud.js"></script>
  <script src="static/js/live_view.js"></script>
  <script src="static/js/voice.js"></script>
  <script src="static/js/waveform.js"></script>
  <script src="static/js/calendar_family.js"></script>
  <script src="static/js/display.js"></script>
  {{ if .Perf }}<script src="static/js/perf.js"></script>{{ end }}
</body>
</html>
