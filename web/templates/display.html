<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090514">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mirrormere</title>
  <base href="./">
  <link rel="stylesheet" id="hud-stylesheet" href="style.css">
</head>
<body data-timezone="{{ .Timezone }}"{{ if .HideCursor }} class="mm-touch-kiosk"{{ end }}{{ if .RemoteURL }} data-remote-url="{{ .RemoteURL }}"{{ end }}>
  <div id="mirrormere-app" data-timezone="{{ .Timezone }}">
    <header class="header-zone">
      <div class="header-time-block">
        <div class="header-clock" id="header-clock" data-timezone="{{ .Timezone }}">--:--</div>
        <div class="header-date" id="header-date">------</div>
      </div>
      <div class="header-weather" id="header-weather">
        <span class="pill-badge" id="weather-pill">
          <span class="weather-temp" id="weather-temp">--°</span>
          <span class="weather-condition" id="weather-condition"></span>
        </span>
      </div>
      <div class="header-voice" id="header-voice">
        <div class="voice-indicator" id="voice-indicator">
          <span class="voice-pulse-ring" id="voice-pulse-ring"></span>
          <span class="voice-dot" id="voice-dot"></span>
          <span class="voice-label" id="voice-label"></span>
        </div>
        <span class="voice-status" id="voice-status" style="display: none;"></span>
        <div class="voice-transcript" id="voice-transcript" style="display: none;"></div>
      </div>
      <div class="header-status">
        <span class="status-dot status-ok" id="system-status-dot" title="System Status: Healthy"></span>
      </div>
    </header>

    <main class="grid-canvas" id="grid-canvas">
      <!-- Active screen widgets mounted dynamically by carousel.js -->
    </main>
  </div>

  <div id="video-stage" class="video-stage" style="display: none;">
    <div id="video-primary-slot" class="video-primary-slot"></div>
    <div id="video-pip-slot" class="video-pip-slot" style="display: none;"></div>
    <div id="video-hud-overlay" class="video-hud-overlay">
      <div class="video-hud-header">
        <span id="video-hud-title" class="video-hud-title">Live Video</span>
      </div>
      <div class="video-hud-side-rail" id="video-hud-side-rail">
        <button id="video-hud-dismiss-btn" class="video-hud-btn video-hud-dismiss" aria-label="Dismiss Video" title="Dismiss Video">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button id="video-hud-mute-btn" class="video-hud-btn video-hud-mute" aria-label="Mute / Unmute" title="Mute / Unmute">
          <span class="video-hud-icon" id="video-hud-mute-icon" data-icon="unmuted">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </span>
        </button>
        <div class="video-hud-volume-container">
          <input type="range" id="video-hud-volume-slider" class="video-hud-volume-slider" min="0" max="100" value="75" aria-label="Master Volume">
        </div>
      </div>
      <div class="video-hud-bottom-bar" id="video-hud-bottom-bar" style="display: none;">
        <button id="video-hud-rewind-btn" class="video-hud-btn video-hud-media-btn" aria-label="Rewind 10 Seconds" title="Rewind 10 Seconds">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polygon points="11 19 2 12 11 5 11 19" fill="currentColor"></polygon>
            <polygon points="22 19 13 12 22 5 22 19" fill="currentColor"></polygon>
          </svg>
        </button>
        <button id="video-hud-play-btn" class="video-hud-btn video-hud-media-btn video-hud-play-primary" aria-label="Play / Pause" title="Play / Pause">
          <span class="video-hud-icon" id="video-hud-play-icon" data-icon="pause">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </span>
        </button>
        <button id="video-hud-forward-btn" class="video-hud-btn video-hud-media-btn" aria-label="Fast Forward 10 Seconds" title="Fast Forward 10 Seconds">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polygon points="13 19 22 12 13 5 13 19" fill="currentColor"></polygon>
            <polygon points="2 19 11 12 2 5 2 19" fill="currentColor"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="voice-toast-dock" class="voice-toast-dock" aria-live="polite">
    <div id="voice-toast" class="voice-toast" style="display: none;">
      <span class="voice-toast-badge" id="voice-toast-badge" style="display: none;"></span>
      <span class="voice-toast-body" id="voice-toast-body"></span>
    </div>
  </div>

  <div id="mm-compositor-heartbeat" class="mm-compositor-heartbeat" aria-hidden="true"></div>

  {{ if .RemoteURL }}
  <script>
    window.MIRRORMERE_REMOTE_URL = {{ .RemoteURL }};
  </script>
  {{ end }}
  <script src="static/js/sse.js"></script>
  <script src="static/js/audio.js"></script>
  <script src="static/js/carousel.js"></script>
  <script src="static/js/video.js"></script>
  <script src="static/js/video_hud.js"></script>
  <script src="static/js/live_view.js"></script>
  <script src="static/js/voice.js"></script>
  <script src="static/js/display.js"></script>
</body>
</html>
