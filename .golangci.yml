version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: use channels, deadline-bounded condition polling, or an injected clock instead of time.Sleep
    gomoddirectives:
      replace-local: true
    perfsprint:
      error-format: false
    tagalign:
      align: true
      sort: false
    dupl:
      threshold: 100
    dupword:
      comments-only: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
    funlen:
      lines: 150
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        # ptrToRefParam: both findings are deliberate pointer-to-reference params
        # (deferred *error metrics hook, lazily initialised *map lock table).
        - ptrToRefParam
        # rangeValCopy: 215 findings (166 production), each a >128-byte struct copy
        # in a range loop with no measured hot path; over the 150-finding budget.
        - rangeValCopy
        # sloppyReassign: contradicts govet shadow; every `if err = f()` it flags
        # reuses an outer err, and the suggested `err :=` is a shadow finding.
        - sloppyReassign
        # sprintfQuotedString: 29 findings, all deliberate wire formats (Discord
        # markdown code spans, ETag quoting, TwiML attributes) where %q/%#q would
        # Go-escape the payload or fall back to double quotes and change output.
        - sprintfQuotedString
        # stringConcatSimplify: pure taste; its 22 findings all collapse readable
        # one-line-per-record strings.Join test fixtures into single long lines.
        - stringConcatSimplify
        - unnamedResult
        - whyNoLint
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - nilness
        - reflectvaluecompare
        - shadow
        - sortslice
        - timeformat
        - unusedwrite
      settings:
        shadow:
          strict: false
    modernize:
      disable:
        - omitzero
    nestif:
      min-complexity: 5
    staticcheck:
      checks:
        - "SA*"
        - "S1*"
        - "QF1*"
    dogsled:
      max-blank-identifiers: 3
    gosec:
      # Audited per rule for mirrormere (build-1794767772 chunk 7). Every rule
      # not listed is enforced; each exclusion below is noise for this codebase.
      excludes:
        # G101: name heuristic; the only hit is the public Google OAuth token
        # endpoint URL (defaultGoogleOAuthTokenURL), not a credential.
        - G101
        # G104: duplicates errcheck, which owns the unchecked-error policy
        # (including its deliberate Close exclusions).
        - G104
        # G115: all 10 hits are Cast v2 protobuf framing in cast-watcher/wire.go:
        # varint field tags, enum fields and frame lengths already bounded by
        # MaxPayloadSize before conversion.
        - G115
        # G301/G306: the config override dir, the photo cache dir and the
        # code-health tool's rewritten Go sources and baseline are ordinary
        # 0755 dirs and 0644 repo files by design (4 hits).
        - G301
        - G306
        # G304/G703: 19 hits, all operator-configured paths (config file,
        # custom CSS, widget package manifests and views, photo/task caches,
        # code-health targets) or files the process itself wrote.
        - G304
        - G703
        # G704: hass-proxy posts to its configured Home Assistant endpoint by
        # design (2 hits).
        - G704
    gosmopolitan:
      allow-time-local: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    thelper:
      tb:
        name: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - errcheck
          - errchkjson
          - goconst
          - gosec
          - gosmopolitan
          - nilnil
          - noctx
          - unparam
        path: _test\.go
      - linters:
          - staticcheck
        path: _test\.go
        text: "SA1012:"
      - linters:
          - containedctx
        path: internal/voice/hub\.go
      - linters:
          - nilnil
        path: internal/provider/header_poller\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/azylman)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
