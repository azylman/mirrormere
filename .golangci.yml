version: "2"
linters:
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - cyclop
    - dupl
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - nestif
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0
      skip-tests: true
    dupl:
      threshold: 100
    funlen:
      lines: 150
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      disable-all: true
      enabled-checks:
        - evalOrder
        - sloppyReassign
    gocyclo:
      min-complexity: 20
    nestif:
      min-complexity: 5
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - hash.Hash.Write
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
    staticcheck:
      checks:
        - "SA*"
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - cyclop
          - dupl
          - errcheck
          - errchkjson
          - funlen
          - gocognit
          - gocyclo
          - ineffassign
          - nestif
          - nilnil
          - noctx
          - staticcheck
          - unparam
          - unused
          - wastedassign
        path: _test\.go
      - linters:
          - containedctx
        path: internal/voice/hub\.go
      - linters:
          - nilnil
        path: internal/provider/header_poller\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
