openapi: 3.1.0
info:
  title: Mirrormere API
  description: Foundation API specification for the Mirrormere ambient smart display daemon.
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check endpoint
      description: Returns service health status for container probes and orchestration.
      operationId: getHealthz
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health:
    get:
      summary: Health check alias endpoint
      description: Alias of /healthz returning service health status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/widgets/{widget_id}/render:
    get:
      summary: Render widget HTML fragment
      description: Retrieves the server-rendered HTML fragment for a single widget instance on demand.
      operationId: getWidgetRender
      parameters:
        - name: widget_id
          in: path
          required: true
          description: Unique identifier of the widget instance
          schema:
            type: string
      responses:
        '200':
          description: Server-rendered HTML fragment
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Widget not found in active configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /widget-types/{type}/assets/{path}:
    get:
      summary: Serve static widget package asset
      description: Serves static assets from the resolved widget package directory with path traversal protection.
      operationId: getWidgetAsset
      parameters:
        - name: type
          in: path
          required: true
          description: Widget type identifier
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: Relative path to the asset within the widget package assets directory
          schema:
            type: string
      responses:
        '200':
          description: Static asset file stream
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path or path traversal attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/screen/select:
    post:
      summary: Select screen by index
      description: Selects an active screen directly by zero-based index and broadcasts screen.rotate.
      operationId: postScreenSelect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenSelectRequest'
      responses:
        '200':
          description: Screen selected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenNavigationResponse'
        '400':
          description: Invalid screen index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/screen/advance:
    post:
      summary: Advance screen sequentially
      description: Advances the active screen forward or backward and broadcasts screen.rotate.
      operationId: postScreenAdvance
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenAdvanceRequest'
      responses:
        '200':
          description: Screen advanced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenNavigationResponse'
        '400':
          description: Invalid direction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/screen/pause:
    post:
      summary: Pause or resume automatic rotation
      description: Controls the automatic screen rotation timer loop with optional auto-resume duration.
      operationId: postScreenPause
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenPauseRequest'
      responses:
        '200':
          description: Screen rotation pause state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenPauseResponse'
        '400':
          description: Invalid pause request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ScreenSelectRequest:
      type: object
      required:
        - screen_index
      properties:
        screen_index:
          type: integer
          description: 0-indexed screen number
          example: 1
    ScreenAdvanceRequest:
      type: object
      properties:
        direction:
          type: string
          enum: [next, prev]
          default: next
          description: Direction to advance screen (next or prev)
          example: next
    ScreenNavigationResponse:
      type: object
      required:
        - status
        - current_screen
        - total_screens
      properties:
        status:
          type: string
          example: ok
        current_screen:
          type: integer
          example: 1
        total_screens:
          type: integer
          example: 2
    ScreenPauseRequest:
      type: object
      required:
        - paused
      properties:
        paused:
          type: boolean
          description: true to pause automatic rotation; false to resume
          example: true
        duration_seconds:
          type: integer
          minimum: 0
          description: Seconds to suspend rotation before auto-resuming (0 = indefinitely)
          example: 120
    ScreenPauseResponse:
      type: object
      required:
        - status
        - paused
        - current_screen
      properties:
        status:
          type: string
          example: ok
        paused:
          type: boolean
          example: true
        current_screen:
          type: integer
          example: 0
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: widget 'custom-sensor-hud' not found in active configuration
