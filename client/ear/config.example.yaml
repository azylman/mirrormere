# /etc/mirrormere/voice.yaml
# The Ear: Mirrormere Edge Voice Listener Daemon Configuration
#
# "ear" is the preferred top-level key (wins if both are present); "voice"
# is still accepted for existing deployed configs.

ear:
  # Unique node identifier (display-1, eink-display-livingroom)
  node_id: "display-1"

  # Base URL of local Mirrormere Core for SSE state broadcasts and HUD updates
  mirrormere_url: "http://localhost:8080"

  # LAN Voice Hub streaming interaction endpoint (POST /api/voice/interact)
  hub_url: "http://localhost:9000/api/voice/interact"

  # Wake mode:
  #   openwakeword (default) - today's behavior, unchanged.
  #   ambient - no wake word. Every VAD-cut speech segment (min 0.4s, max
  #     max_record_seconds) is POSTed to ambient_url; engaging runs the same
  #     hub interaction a wake word would, on the same WAV.
  #   both - the wake word still triggers directly; segments without one go
  #     through the ambient gate.
  wake_mode: "openwakeword"

  # Ambient classifier endpoint (required for wake_mode: ambient or both).
  # Classifier-gated ambient wake mode configuration.
  # ambient_url: "http://192.168.1.77:9098/ambient"

  # Timeout (seconds) for the ambient classification request.
  ambient_timeout_seconds: 6.0

  # Target wake words to activate on. Each entry must match a loaded model
  # name explicitly (built-in openWakeWord models require their versioned name,
  # e.g. "alexa_v0.1" or "hey_jarvis_v0.1").
  wake_models:
    - "hey_jarvis_v0.1"

  # Confidence threshold for wake word activation (0.0 to 1.0)
  threshold: 0.35

  # Directory scanned for custom .onnx wake word models
  models_dir: "/opt/mirrormere/voice/models"

  # VAD Silence detection: how many ms of silence after speech ends an utterance
  silence_ms: 400

  # Maximum duration of a single utterance before auto-saving (seconds)
  max_record_seconds: 10.0

  # Calibrated speech energy floor in dBFS (speech must exceed this to count as active).
  # Only used when vad: "energy" (the default).
  speech_threshold_db: -31.0

  # End-of-speech detection: "energy" (default, the speech_threshold_db gate
  # above) or "silero" (Silero VAD neural speech probability, reusing
  # openWakeWord's bundled ONNX model - no new dependency). Falls back to
  # energy mode automatically if the model fails to load.
  vad: "energy"

  # Silero speech-probability threshold (0.0-1.0). Only used when vad: "silero".
  vad_threshold: 0.5

  # Barge-in (default off): while a reply is playing, stop playback and start
  # a new turn when you speak over it. Requires Silero (the daemon logs a
  # warning and leaves barge-in disabled if it cannot load) and an
  # echo-cancelled mic; without echo cancellation the daemon hears its own
  # reply and cuts itself off.
  barge_in: false

  # Continuous speech (ms) required before playback is cut. A single
  # non-speech frame inside a word is tolerated; two in a row reset the count.
  barge_in_min_speech_ms: 300

  # Silero speech-probability threshold (0.0-1.0) used only during playback.
  # Higher than vad_threshold because residual echo leaks through the AEC.
  barge_in_vad_threshold: 0.7

  # Refractory cooldown period after utterance to prevent echo re-triggers (seconds)
  cooldown_seconds: 2.5

  # Output path for captured utterance WAV file
  save_path: "/tmp/last_utterance.wav"

  # ALSA / PipeWire capture device node
  audio_device: "default"

  # Audio sampling configuration (16 kHz 16-bit mono PCM required by openWakeWord & Whisper)
  sample_rate: 16000
  chunk_samples: 1280

  # Waveform levels for the display's voice mouth (GET /levels, SSE).
  # 0 disables. The display reads it via display.voice.waveform.levels_url.
  waveform_levels_port: 0
  waveform_levels_host: "127.0.0.1"
  waveform_levels_latency_ms: 300

# --- Example: ambient (edge, no wake word) config -----------------------
# ear:
#   wake_mode: ambient
#   ambient_url: "http://192.168.1.77:9098/ambient"

# --- Example: Sherpa-ONNX edge wake word config -------------------------
# ear:
#   wake_engine: "sherpa-onnx"
#   vad: "silero"
#   # By default, uses bundled /opt/mirrormere/voice/sherpa/keywords.txt.
#   # To supply a custom keywords file (generated via sherpa-onnx-cli text2token):
#   keywords_file: "/config/keywords.txt"
#   # Or inline tokenized keywords:
#   # keyword: " ▁HE Y ▁S I RI @hey_siri"
#   # Tuning parameters:
#   keywords_score: 1.0
#   keywords_threshold: 0.25
