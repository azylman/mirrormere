name: Continuous Delivery

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build and publish all container images'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changed Microservices
    runs-on: [self-hosted, ci]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      go_core: ${{ steps.filter.outputs.go_core }}
      web: ${{ steps.filter.outputs.web }}
      ui: ${{ steps.filter.outputs.ui }}
      perf: ${{ steps.filter.outputs.perf }}
      eink_node: ${{ steps.filter.outputs.eink_node }}
      eink_renderer: ${{ steps.filter.outputs.mirrormere-eink-renderer }}
      ear: ${{ steps.filter.outputs.mirrormere-ear }}
      remote: ${{ steps.filter.outputs.mirrormere-remote }}
      ember: ${{ steps.filter.outputs.ember }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Path Filter Check
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci_scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            go_core:
              - 'Dockerfile'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.code-health-baseline.json'
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'web/**/*.go'
              - 'client/cast-watcher/**'
              - 'sidecars/hass-proxy/**'
            web:
              - 'web/**'
              - 'widgets/**'
            ui:
              - 'web/ui/**'
            perf:
              - 'web/ui/**'
              - 'web/static/js/perf.js'
              - 'web/templates/display_react.html'
              - 'deploy/examples/config.yaml'
              - 'scripts/perf/**'
            eink_node:
              - 'client/eink-node/**'
            mirrormere:
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'Makefile'
              - 'web/ui/**'
              - 'web/templates/**'
              - 'web/static/**'
            mirrormere-cast-watcher:
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'client/cast-watcher/**'
            mirrormere-eink-renderer:
              - 'sidecars/eink-renderer/**'
            mirrormere-voice-fingerprinter:
              - 'sidecars/voice-fingerprinter/**'
            mirrormere-ear:
              - 'client/ear/**'
            mirrormere-remote:
              - 'client/remote/**'
            ember:
              - 'client/ember/**'
            mirrormere-hass-proxy:
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'sidecars/hass-proxy/**'

      - name: Compute Dynamic Build Matrix
        id: set-matrix
        run: |
          node -e '
            const filter = {
              mirrormere: "${{ steps.filter.outputs.mirrormere }}",
              "mirrormere-cast-watcher": "${{ steps.filter.outputs.mirrormere-cast-watcher }}",
              "mirrormere-eink-renderer": "${{ steps.filter.outputs.mirrormere-eink-renderer }}",
              "mirrormere-voice-fingerprinter": "${{ steps.filter.outputs.mirrormere-voice-fingerprinter }}",
              "mirrormere-ear": "${{ steps.filter.outputs.mirrormere-ear }}",
              "mirrormere-remote": "${{ steps.filter.outputs.mirrormere-remote }}",
              "mirrormere-hass-proxy": "${{ steps.filter.outputs.mirrormere-hass-proxy }}"
            };

            const catalog = [
              { service: "mirrormere", context: ".", file: "./Dockerfile", image_name: "mirrormere" },
              { service: "mirrormere-cast-watcher", context: ".", file: "./client/cast-watcher/Dockerfile", image_name: "mirrormere-cast-watcher" },
              { service: "mirrormere-eink-renderer", context: "./sidecars/eink-renderer", file: "./sidecars/eink-renderer/Dockerfile", image_name: "mirrormere-eink-renderer" },
              { service: "mirrormere-voice-fingerprinter", context: "./sidecars/voice-fingerprinter", file: "./sidecars/voice-fingerprinter/Dockerfile", image_name: "mirrormere-voice-fingerprinter" },
              { service: "mirrormere-ear", context: "./client/ear", file: "./client/ear/Dockerfile", image_name: "mirrormere-ear" },
              { service: "mirrormere-remote", context: "./client/remote", file: "./client/remote/Dockerfile", image_name: "mirrormere-remote" },
              { service: "mirrormere-hass-proxy", context: ".", file: "./sidecars/hass-proxy/Dockerfile", image_name: "mirrormere-hass-proxy" }
            ];

            const forceAll = "${{ inputs.force_all }}" === "true";
            const matrix = forceAll ? catalog : catalog.filter(c => filter[c.service] === "true");
            console.log("Computed matrix:", JSON.stringify(matrix));
            const hasBuilds = matrix.length > 0;
            const fs = require("fs");
            const output = process.env.GITHUB_OUTPUT;
            const safeMatrix = hasBuilds ? matrix : [{ service: "none", context: ".", file: "./Dockerfile", image_name: "none" }];
            fs.appendFileSync(output, `matrix=${JSON.stringify(safeMatrix)}\n`);
            fs.appendFileSync(output, `has_builds=${hasBuilds}\n`);
          '

  verify:
    name: Verify Codebase
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js (pinned by web/ui/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/ui/.nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Run Go Unit Tests & Coverage Gate
        if: needs.changes.outputs.go_core == 'true' || needs.changes.outputs.ci_scripts == 'true' || inputs.force_all == true
        run: |
          sh scripts/check-coverage.sh --check --summary

      - name: Run Web & Sidecar Node.js Unit Tests
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.eink_renderer == 'true' || needs.changes.outputs.ci_scripts == 'true' || inputs.force_all == true
        run: |
          set -e
          if [ "${{ needs.changes.outputs.web }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running web client test suite..."
            TZ=UTC node --test web/test/*.test.js
            if [ "${{ needs.changes.outputs.go_core }}" != "true" ] && [ "${{ needs.changes.outputs.ci_scripts }}" != "true" ] && [ "${{ inputs.force_all }}" != "true" ]; then
              echo "Validating HTML templates and widget manifests with Go tests..."
              go test ./web ./internal/render ./internal/server ./internal/widget
            fi
          fi
          if [ "${{ needs.changes.outputs.eink_renderer }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running eink-renderer sidecar test suite..."
            TZ=UTC node --test sidecars/eink-renderer/test/*.test.js
          fi

      - name: Run Python Client Unit Tests
        if: needs.changes.outputs.eink_node == 'true' || needs.changes.outputs.ear == 'true' || needs.changes.outputs.remote == 'true' || needs.changes.outputs.ember == 'true' || needs.changes.outputs.ci_scripts == 'true' || inputs.force_all == true
        run: |
          set -e
          if [ "${{ needs.changes.outputs.eink_node }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running e-ink node client test suite..."
            PYTHONPATH="client/eink-node" python3 -m unittest discover -s client/eink-node/tests -p "test_*.py"
          fi
          if [ "${{ needs.changes.outputs.ear }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running edge ear (voice) daemon test suite..."
            PYTHONPATH="." python3 -m unittest discover -s client/ear/tests -p "test_*.py"
          fi
          if [ "${{ needs.changes.outputs.remote }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running remote (bluetooth/chromecast) client test suite..."
            PYTHONPATH="client/remote" python3 -m unittest discover -s client/remote/tests -p "test_*.py"
          fi
          if [ "${{ needs.changes.outputs.ember }}" = "true" ] || [ "${{ needs.changes.outputs.ci_scripts }}" = "true" ] || [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Running EMBER Android client test suite..."
            PYTHONPATH="client/ember" python3 -m pytest client/ember/tests/test_ember.py -q
            (cd client/ember && ./gradlew testDebugUnitTest)
          fi

  ui:
    name: React UI (web/ui)
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    defaults:
      run:
        working-directory: web/ui
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js (pinned by web/ui/.nvmrc)
        if: needs.changes.outputs.ui == 'true' || inputs.force_all == true
        uses: actions/setup-node@v7
        with:
          node-version-file: web/ui/.nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install, lint, typecheck, test with coverage, and build
        if: needs.changes.outputs.ui == 'true' || inputs.force_all == true
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run deadcode
          npm run typecheck
          npm run test:coverage
          npm run build
          npx playwright test

  perf:
    name: Display performance budget (React)
    needs: [changes, verify, lint, ui]
    if: github.event_name != 'push' || inputs.force_all == true
    # Self-hosted runner: ships headless Chrome, Go, and Node (docs/perf.md).
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js (pinned by web/ui/.nvmrc)
        if: needs.changes.outputs.perf == 'true' || inputs.force_all == true
        uses: actions/setup-node@v7
        with:
          node-version-file: web/ui/.nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Build React UI bundle
        if: needs.changes.outputs.perf == 'true' || inputs.force_all == true
        working-directory: web/ui
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Start the server with the example config and fixture providers
        if: needs.changes.outputs.perf == 'true' || inputs.force_all == true
        run: |
          set -euo pipefail
          pkill -x server || true
          go build -o bin/server ./cmd/server
          # The example config reads these secrets by name; the fixture values point at nothing,
          # so the providers fail fast and the screens still load from config (docs/perf.md).
          export FAMILY_CALENDAR_URL=http://localhost:9/fixture.ics
          export TODOIST_API_TOKEN=fixture-token
          export GOOGLE_PHOTOS_ALBUM_URL=http://localhost:9/fixture-photos
          RUNNER_TRACKING_ID="" CONFIG_PATH=deploy/examples/config.yaml ./bin/server > server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null 'http://localhost:8080/display?ui=react'; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null 'http://localhost:8080/display?ui=react'

      - name: Bench the React display (4x CPU throttle, 20 swipes)
        if: needs.changes.outputs.perf == 'true' || inputs.force_all == true
        run: |
          set -euo pipefail
          node scripts/perf/bench.mjs --url 'http://localhost:8080/display?ui=react&perf=1' --cpu-throttle 4 --swipes 20 > bench.json

      - name: Check the performance budget and app.js size
        if: needs.changes.outputs.perf == 'true' || inputs.force_all == true
        run: node scripts/perf/check-budget.mjs --bench bench.json --budget scripts/perf/budget.json --app-js web/static/ui/app.js

      - name: Upload bench output and server log
        if: always() && (needs.changes.outputs.perf == 'true' || inputs.force_all == true)
        uses: actions/upload-artifact@v7
        with:
          name: perf-bench
          path: |
            bench.json
            server.log
          if-no-files-found: ignore

      - name: Stop the server
        if: always() && (needs.changes.outputs.perf == 'true' || inputs.force_all == true)
        run: pkill -x server || true

  lint:
    name: Lint Microservices & Frontend
    needs: changes
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: [self-hosted, ci]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Repo-Wide Hygiene Guards
        run: |
          set -eu
          # 1. UTF-8 BOM Hygiene
          BOM_HEX=$(printf '\357\273\277')
          BOM_FILES=$(git grep -I -l "^$BOM_HEX" 2>/dev/null || true)
          if [ -n "$BOM_FILES" ]; then
            echo "🚨 [Mirrormere Verify] Error: Invalid UTF-8 BOM detected in tracked files:" >&2
            echo "$BOM_FILES" | sed 's/^/   • /' >&2
            exit 1
          fi

          # 2. No Imperative DDL in Application Code
          DDL_FILES=$(find . -maxdepth 4 -type f \( -name "*.go" -o -name "*.py" -o -name "*.ts" \) \
            ! -name "*_test.go" ! -name "*.test.ts" ! -name "test_*.py" \
            ! -path "*/vendor/*" ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/scripts/*" 2>/dev/null || true)
          if [ -n "$DDL_FILES" ]; then
            VIOLATIONS=$(echo "$DDL_FILES" | while read -r f; do
              [ -f "$f" ] || continue
              grep -H -n -i -E '\b(CREATE|ALTER|DROP)[[:space:]]+TABLE\b' "$f" 2>/dev/null | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*(//|#|\*)' || true
            done)
            if [ -n "$VIOLATIONS" ]; then
              echo "🚨 [Mirrormere Verify] Imperative DDL (CREATE/ALTER/DROP TABLE) detected in application code:" >&2
              echo "$VIOLATIONS" | sed 's/^/   • /' >&2
              exit 1
            fi
          fi

          # 3. Dependabot Configuration & Security Group Coverage
          DEP_FILE=".github/dependabot.yml"
          if [ ! -f "$DEP_FILE" ]; then
            echo "🚨 [Mirrormere Verify] Error: Missing .github/dependabot.yml configuration file!" >&2
            exit 1
          fi
          MISSING_MANIFESTS=""
          DISCOVERED_DIRS=$(find . -maxdepth 3 -type f \( -name "go.mod" -o -name "Cargo.toml" -o -name "pyproject.toml" -o -name "package.json" -o -name "requirements.txt" \) \
            ! -path "*/vendor/*" ! -path "*/node_modules/*" ! -path "*/testdata/*" ! -path "*/.*" 2>/dev/null | \
            sed 's|^\./||' | while read -r mf; do dirname "$mf"; done | sort -u)
          for dir in $DISCOVERED_DIRS; do
            if [ "$dir" = "." ]; then target_dir="/"; else target_dir="/$dir"; fi
            if ! grep -q -F "\"${target_dir}\"" "$DEP_FILE" && ! grep -q -F "'${target_dir}'" "$DEP_FILE" && ! grep -q -E "^[[:space:]]*(-[[:space:]]*)?\"?${target_dir}\"?[[:space:]]*$" "$DEP_FILE"; then
              case " $MISSING_MANIFESTS " in
                *" $target_dir "*) ;;
                *) MISSING_MANIFESTS="${MISSING_MANIFESTS} $target_dir" ;;
              esac
            fi
          done
          if [ -n "$MISSING_MANIFESTS" ]; then
            echo "🚨 [Mirrormere Verify] Error: Discovered package directories missing from .github/dependabot.yml:$MISSING_MANIFESTS" >&2
            exit 1
          fi
          ECO_COUNT=$(grep -c "package-ecosystem:" "$DEP_FILE" || true)
          VER_COUNT=$(grep -c "applies-to:[[:space:]]*version-updates" "$DEP_FILE" || true)
          SEC_COUNT=$(grep -c "applies-to:[[:space:]]*security-updates" "$DEP_FILE" || true)
          if [ "$ECO_COUNT" -le 0 ] || [ "$ECO_COUNT" -ne "$VER_COUNT" ] || [ "$ECO_COUNT" -ne "$SEC_COUNT" ]; then
            echo "🚨 [Mirrormere Verify] Error: Dependabot grouping mismatch in .github/dependabot.yml!" >&2
            exit 1
          fi

          # 4. Frontend Per-Widget CSS Co-Location
          if [ -f "web/ui/src/styles/widgets.css" ]; then
            echo "🚨 [Mirrormere Verify] Error: web/ui/src/styles/widgets.css must not exist." >&2
            exit 1
          fi
          if [ -d "web/ui/src/styles" ] && grep -rn -F '[data-widget-type=' "web/ui/src/styles" >/dev/null 2>&1; then
            echo "🚨 [Mirrormere Verify] Error: Monolithic widget selectors ([data-widget-type=) found under web/ui/src/styles/." >&2
            exit 1
          fi

      - name: Auto-sort Server Routes and Handlers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          go run ./scripts/code-health -fix -root . -baseline .code-health-baseline.json
          if ! git diff --quiet; then
            git fetch origin "${GITHUB_HEAD_REF}"
            git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
            go run ./scripts/code-health -fix -root . -baseline .code-health-baseline.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: auto-sort server routes and handlers [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi

      - name: Run Static Analysis, Codegen Drift & Linting
        if: needs.changes.outputs.go_core == 'true' || needs.changes.outputs.ci_scripts == 'true' || inputs.force_all == true
        run: |
          set -eu
          UNFORMATTED=$(gofmt -l . 2>/dev/null | grep -v -E '(^|/)vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "🚨 [Mirrormere Verify] Error: Unformatted Go files detected (run gofmt -w or golangci-lint fmt):" >&2
            echo "$UNFORMATTED" | sed 's/^/   • /' >&2
            exit 1
          fi

          GOPATH_DIR="$(go env GOPATH 2>/dev/null || true)"
          BIN_DIR="${GOPATH_DIR:-$HOME/go}/bin"
          export PATH="$BIN_DIR:$PATH"
          mkdir -p "$BIN_DIR"
          CODE_HEALTH_BIN="$BIN_DIR/mirrormere-code-health"
          SRC_SUM=$(cksum scripts/code-health/*.go 2>/dev/null || true)
          if [ ! -x "$CODE_HEALTH_BIN" ] || [ -z "$SRC_SUM" ] || [ "$(cat "${CODE_HEALTH_BIN}.cksum" 2>/dev/null || true)" != "$SRC_SUM" ]; then
            (cd scripts/code-health && go build -o "$CODE_HEALTH_BIN" .)
            printf '%s\n' "$SRC_SUM" > "${CODE_HEALTH_BIN}.cksum"
          fi
          if ! command -v deadcode >/dev/null 2>&1; then
            go install golang.org/x/tools/cmd/deadcode@v0.52.0
          fi

          MAIN_PKGS=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
          LOG_HEALTH=$(mktemp)
          LOG_LINT=$(mktemp)
          LOG_DEAD_PROD=$(mktemp)
          LOG_DEAD_TEST=$(mktemp)

          "$CODE_HEALTH_BIN" -root . -baseline .code-health-baseline.json > "$LOG_HEALTH" 2>&1 &
          P_HEALTH=$!
          golangci-lint run --allow-parallel-runners ./... > "$LOG_LINT" 2>&1 &
          P_LINT=$!
          # shellcheck disable=SC2086
          deadcode $MAIN_PKGS > "$LOG_DEAD_PROD" 2>&1 &
          P_DEAD_PROD=$!
          deadcode -test ./... > "$LOG_DEAD_TEST" 2>&1 &
          P_DEAD_TEST=$!

          RC_HEALTH=0; wait "$P_HEALTH" || RC_HEALTH=$?
          RC_LINT=0; wait "$P_LINT" || RC_LINT=$?
          RC_DEAD_PROD=0; wait "$P_DEAD_PROD" || RC_DEAD_PROD=$?
          RC_DEAD_TEST=0; wait "$P_DEAD_TEST" || RC_DEAD_TEST=$?

          cat "$LOG_HEALTH" "$LOG_LINT"
          DEAD_PROD=$(cat "$LOG_DEAD_PROD" 2>/dev/null || true)
          DEAD_TEST=$(cat "$LOG_DEAD_TEST" 2>/dev/null || true)
          rm -f "$LOG_HEALTH" "$LOG_LINT" "$LOG_DEAD_PROD" "$LOG_DEAD_TEST"

          if [ "$RC_DEAD_PROD" -ne 0 ] || [ -n "$DEAD_PROD" ]; then
            echo "🚨 [Mirrormere Verify] Unreachable production code or compiled-in test hooks detected:" >&2
            echo "$DEAD_PROD" | sed 's/^/   • /' >&2
            exit 1
          fi
          if [ "$RC_DEAD_TEST" -ne 0 ] || [ -n "$DEAD_TEST" ]; then
            echo "🚨 [Mirrormere Verify] Dead code detected:" >&2
            echo "$DEAD_TEST" | sed 's/^/   • /' >&2
            exit 1
          fi
          if [ "$RC_HEALTH" -ne 0 ] || [ "$RC_LINT" -ne 0 ]; then
            exit 1
          fi

  docker:
    name: Build & Publish Container Image (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.has_builds == 'true'
    runs-on: [self-hosted, ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run voice-fingerprinter unit tests
        if: matrix.service == 'mirrormere-voice-fingerprinter' && (github.event_name != 'push' || inputs.force_all == true)
        run: |
          cd sidecars/voice-fingerprinter && python3 -m pytest test/ -v

      - name: Set up Persistent Local Buildx Builder
        run: |
          mkdir -p /cache/buildx-config /root/.docker/buildx/instances
          flock /cache/buildx.lock bash -c '
            if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
              docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
            fi
            export BUILDX_CONFIG=/cache/buildx-config
            if ! docker buildx inspect --bootstrap calibarn-buildkit >/dev/null 2>&1; then
              docker buildx rm -f calibarn-buildkit >/dev/null 2>&1 || true
              docker rm -f buildx_buildkit_calibarn-buildkit0 >/dev/null 2>&1 || true
              docker buildx create --name calibarn-buildkit --driver docker-container --driver-opt network=host --use --bootstrap
            fi
            cp -f /cache/buildx-config/instances/calibarn-buildkit /root/.docker/buildx/instances/calibarn-buildkit
          '
          docker buildx use calibarn-buildkit

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Git Tree SHA
        id: tree_check
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; } && [ "$REF" = "refs/heads/main" ] && [ "$FORCE_ALL" != "true" ]; then
            if docker buildx imagetools inspect "ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Push Image from PR Tree Cache (${{ matrix.service }})
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.tree_check.outputs.exists == 'true'
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
          SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.tree_check.outputs.tree_sha }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:${SHA}" \
            --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:latest" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            "$SRC"

      - name: Build and Push Docker Image
        if: steps.tree_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}:tree-${{ steps.tree_check.outputs.tree_sha }}
            ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && format('ghcr.io/{0}/{1}:{2}', steps.repo_owner.outputs.owner, matrix.image_name, github.sha) || '' }}
            ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && format('ghcr.io/{0}/{1}:latest', steps.repo_owner.outputs.owner, matrix.image_name) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  roborev:
    name: roborev
    if: >
      github.event_name == 'pull_request' &&
      (github.actor == 'azylman' || github.actor == 'mcarmody' || github.actor == 'brockventures' || github.actor == 'dependabot[bot]') &&
      (github.event.pull_request.user.login == 'azylman' || github.event.pull_request.user.login == 'mcarmody' || github.event.pull_request.user.login == 'brockventures' || github.event.pull_request.user.login == 'dependabot[bot]') &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event.pull_request.head.repo.full_name == 'mcarmody/mirrormere' ||
       github.event.pull_request.head.repo.full_name == 'brockventures/mirrormere')
    runs-on: [self-hosted, roborev]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: read
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot Metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      - name: Run Independent RoboRev Review Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -o pipefail
          if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ] || [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Dependabot PR detected; skipping RoboRev LLM review gate."
            exit 0
          fi
          if ! git cat-file -e origin/main:.roborev.toml 2>/dev/null; then
            echo "RoboRev not bootstrapped on main; skipping."
            exit 0
          fi
          export GH_TOKEN="${GITHUB_PAT:-${GH_TOKEN}}"
          export GITHUB_TOKEN="${GITHUB_PAT:-${GITHUB_TOKEN}}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            OVERRIDE_COMMENT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq "[.[] | select(.user.login == \"azylman\" and (.body | contains(\"## roborev-override\")) and ((.body | contains(\"${HEAD_SHA}\")) or (.body | contains(\"${SHORT_SHA}\"))))] | last | .body // empty" 2>/dev/null || true)
            if [ -n "${OVERRIDE_COMMENT}" ]; then
              echo "${OVERRIDE_COMMENT}" >> "$GITHUB_STEP_SUMMARY"
              echo "RoboRev gate overridden for commit ${SHORT_SHA} via verified technical rebuttal."
              exit 0
            fi

            CUR_PATCH=$(git diff "origin/main...${HEAD_SHA}" 2>/dev/null | git patch-id --stable | awk '{print $1}')
            if [ -n "${CUR_PATCH:-}" ]; then
              CANDIDATE_SHAS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" --jq '.[].sha' 2>/dev/null || true)
              PARENT_SHA=$(git rev-parse --verify "${HEAD_SHA}^1" 2>/dev/null || true)
              ALL_CANDIDATES=$(printf "%s\n%s\n" "${CANDIDATE_SHAS}" "${PARENT_SHA}" | grep -v '^[[:space:]]*$' | sort -u || true)
              for PREV_SHA in $ALL_CANDIDATES; do
                if [ "$PREV_SHA" = "$HEAD_SHA" ]; then
                  continue
                fi
                if ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
                  continue
                fi
                PREV_PATCH=$(git diff "origin/main...${PREV_SHA}" 2>/dev/null | git patch-id --stable | awk '{print $1}')
                if [ -n "${PREV_PATCH:-}" ] && [ "$PREV_PATCH" = "$CUR_PATCH" ]; then
                  PASSED_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREV_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "roborev" and .status == "completed" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
                  if [ "${PASSED_COUNT:-0}" -gt 0 ]; then
                    SUMMARY_LINE="RoboRev gate passed via unchanged patch-id ${CUR_PATCH:0:12} inherited from green commit ${PREV_SHA:0:7}."
                    echo "$SUMMARY_LINE" >> "$GITHUB_STEP_SUMMARY"
                    echo "$SUMMARY_LINE"
                    exit 0
                  fi
                fi
              done
            fi
          fi
          roborev ci review \
            --agent gemini \
            --min-severity medium \
            --reasoning thorough | tee /tmp/roborev-review.md
          cat /tmp/roborev-review.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "Synthesis unavailable" /tmp/roborev-review.md; then
            echo "::error::RoboRev synthesis failed or fell back to raw output; failing closed."
            exit 1
          fi
          if grep -Eq '^## roborev: Review Passed|^No issues found\.$|^No findings at or above [a-z]+ severity\.$|roborev: no changes to review' /tmp/roborev-review.md; then
            echo "RoboRev gate passed."
            exit 0
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "${PR_NUMBER}" --body-file /tmp/roborev-review.md || true
          fi
          echo "::error::RoboRev reported actionable findings (>= medium severity)."
          exit 1

      - name: Enable Auto-Merge on Review Pass
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          export GH_TOKEN="${GITHUB_PAT:-${GH_TOKEN}}"
          gh pr merge --auto --squash "$PR_URL" || true

  build-gate:
    name: CI Gate
    needs: [changes, verify, lint, ui, perf, roborev, docker]
    if: always()
    runs-on: [self-hosted, ci]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
      HAS_BUILDS: ${{ needs.changes.outputs.has_builds }}
    steps:
      - name: Verify All Upstream Jobs & Container Builds
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          FAILED=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$FAILED" ]; then
            echo "::error::Upstream job(s) failed or were cancelled: $FAILED"
            exit 1
          fi
          UNEXPECTED_SKIP=$(echo "$NEEDS_JSON" | jq -r --arg event "$EVENT_NAME" --arg has_builds "${HAS_BUILDS:-false}" '
            [to_entries[] | select(
              .value.result == "skipped" and (
                .key == "changes" or
                .key == "validate" or
                ((.key == "build-and-push" or .key == "docker") and $has_builds == "true") or
                (.key != "build-and-push" and .key != "docker" and $event == "pull_request")
              )
            ) | .key] | join(", ")
          ')
          if [ -n "$UNEXPECTED_SKIP" ]; then
            echo "::error::Required upstream job(s) were unexpectedly skipped: $UNEXPECTED_SKIP"
            exit 1
          fi
          echo "All required checks and builds passed."
