name: Continuous Delivery

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build and publish all container images'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Codebase
    if: github.event_name != 'push' || inputs.force_all == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: |
          mkdir -p $(go env GOPATH)/bin
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz | tar -xz -C $(go env GOPATH)/bin --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint

      - name: Run Full Verification Pipeline
        run: |
          sh scripts/verify.sh --full

  changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Path Filter Check
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mirrormere:
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'Makefile'
            mirrormere-cast-watcher:
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'client/cast-watcher/**'
            mirrormere-eink-renderer:
              - 'sidecars/eink-renderer/**'
            mirrormere-voice-fingerprinter:
              - 'sidecars/voice-fingerprinter/**'
            mirrormere-ear:
              - 'client/ear/**'
            mirrormere-remote:
              - 'client/remote/**'
            mirrormere-hass-proxy:
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'sidecars/hass-proxy/**'

      - name: Compute Dynamic Build Matrix
        id: set-matrix
        run: |
          node -e '
            const filter = {
              mirrormere: "${{ steps.filter.outputs.mirrormere }}",
              "mirrormere-cast-watcher": "${{ steps.filter.outputs.mirrormere-cast-watcher }}",
              "mirrormere-eink-renderer": "${{ steps.filter.outputs.mirrormere-eink-renderer }}",
              "mirrormere-voice-fingerprinter": "${{ steps.filter.outputs.mirrormere-voice-fingerprinter }}",
              "mirrormere-ear": "${{ steps.filter.outputs.mirrormere-ear }}",
              "mirrormere-remote": "${{ steps.filter.outputs.mirrormere-remote }}",
              "mirrormere-hass-proxy": "${{ steps.filter.outputs.mirrormere-hass-proxy }}"
            };

            const catalog = [
              { name: "mirrormere", context: ".", file: "./Dockerfile" },
              { name: "mirrormere-cast-watcher", context: ".", file: "./client/cast-watcher/Dockerfile" },
              { name: "mirrormere-eink-renderer", context: "./sidecars/eink-renderer", file: "./sidecars/eink-renderer/Dockerfile" },
              { name: "mirrormere-voice-fingerprinter", context: "./sidecars/voice-fingerprinter", file: "./sidecars/voice-fingerprinter/Dockerfile" },
              { name: "mirrormere-ear", context: "./client/ear", file: "./client/ear/Dockerfile" },
              { name: "mirrormere-remote", context: "./client/remote", file: "./client/remote/Dockerfile" },
              { name: "mirrormere-hass-proxy", context: ".", file: "./sidecars/hass-proxy/Dockerfile" }
            ];

            const forceAll = "${{ inputs.force_all }}" === "true";
            const matrix = forceAll ? catalog : catalog.filter(c => filter[c.name] === "true");
            console.log("Computed matrix:", JSON.stringify(matrix));
            const hasBuilds = matrix.length > 0;
            const fs = require("fs");
            const output = process.env.GITHUB_OUTPUT;
            const safeMatrix = hasBuilds ? matrix : [{ name: "none", context: ".", file: "./Dockerfile" }];
            fs.appendFileSync(output, `matrix=${JSON.stringify(safeMatrix)}\n`);
            fs.appendFileSync(output, `has_builds=${hasBuilds}\n`);
          '

  docker:
    name: Build & Publish Container Image (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python (voice-fingerprinter unit tests)
        if: matrix.name == 'mirrormere-voice-fingerprinter' && (github.event_name != 'push' || inputs.force_all == true)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run voice-fingerprinter unit tests
        if: matrix.name == 'mirrormere-voice-fingerprinter' && (github.event_name != 'push' || inputs.force_all == true)
        run: |
          pip install --quiet -r sidecars/voice-fingerprinter/requirements-test.txt
          cd sidecars/voice-fingerprinter && python -m pytest test/ -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Git Tree SHA
        id: tree_check
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ "$FORCE_ALL" != "true" ]; then
            if docker buildx imagetools inspect "ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Push Image from PR Tree Cache (${{ matrix.name }})
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tree_check.outputs.exists == 'true'
        env:
          OWNER: ${{ steps.repo_owner.outputs.owner }}
          IMAGE_NAME: ${{ matrix.name }}
          SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.tree_check.outputs.tree_sha }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/${OWNER}/${IMAGE_NAME}:tree-${TREE_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:${SHA}" \
            --tag "ghcr.io/${OWNER}/${IMAGE_NAME}:latest" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            "$SRC"

      - name: Set up QEMU
        if: steps.tree_check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Build and Push Docker Image
        if: steps.tree_check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:tree-${{ steps.tree_check.outputs.tree_sha }}
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}/{1}:{2}', steps.repo_owner.outputs.owner, matrix.name, github.sha) || '' }}
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}/{1}:latest', steps.repo_owner.outputs.owner, matrix.name) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.name }}:buildcache
            type=gha,scope=${{ matrix.name }}
          cache-to: |
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', steps.repo_owner.outputs.owner, matrix.name) || '' }}
            type=gha,mode=max,scope=${{ matrix.name }}

  build-gate:
    name: Container Builds Gate
    needs: [verify, changes, docker]
    if: always() && !cancelled() && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Container Builds
        run: |
          VERIFY_RES="${{ needs.verify.result }}"
          CHANGES_RES="${{ needs.changes.result }}"
          DOCKER_RES="${{ needs.docker.result }}"
          HAS_BUILDS="${{ needs.changes.outputs.has_builds }}"

          echo "Verify status: $VERIFY_RES"
          echo "Changes status: $CHANGES_RES"
          echo "Has builds: $HAS_BUILDS"
          echo "Docker builds status: $DOCKER_RES"

          if [ "$VERIFY_RES" != "success" ] && { [ "${{ github.event_name }}" != "push" ] || [ "$VERIFY_RES" != "skipped" ]; }; then
            echo "::error::Codebase verification failed"
            exit 1
          fi

          if [ "$CHANGES_RES" != "success" ]; then
            echo "::error::Changes detection failed"
            exit 1
          fi

          if [ "$HAS_BUILDS" = "false" ]; then
            echo "No container builds required for this change. Gate passed."
            exit 0
          fi

          if [ "$DOCKER_RES" != "success" ]; then
            echo "::error::One or more container builds failed or were cancelled"
            exit 1
          fi

          echo "All required checks and container builds passed successfully."
