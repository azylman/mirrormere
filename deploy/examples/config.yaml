# Mirrormere Reference Configuration Template
# Authoritative Documentation: README.md, docs/decisions.md, api/openapi.yaml

# Server host and port bindings (restart required to apply changes)
host: "0.0.0.0"
port: 8080

# Authoritative household IANA timezone
timezone: "America/Los_Angeles"

# Device physical location (used for weather and day/night sunrise/sunset calculations)
location:
  name: "Oakland"
  latitude: 37.8044
  longitude: -122.2712

# Display and layout configuration
display:
  # Display shell served at /display: "legacy" (display.html, default) or "react" (display_react.html + web/static/ui/app.js).
  # The ?ui=react or ?ui=legacy query parameter overrides this per request.
  ui: "legacy"

  # Visual theme mode: "auto" (switches at local sunrise/sunset), "day", or "night" (Sailor HG Fairyfloss)
  theme:
    mode: "auto"

  # Grid orientation: 6x2 (landscape default) or 2x6 (portrait)
  grid:
    columns: 6
    rows: 2

  rotation:
    interval_seconds: 30
    transition: "slide"

  # Persistent Fixed Header
  header:
    enabled: true
    elements:
      - clock
      - date
      - weather_badge
      - sync_status
    # Autonomous header weather poller hydrating header.update (inherits coordinates from location)
    weather:
      refresh_interval_seconds: 900
      units: imperial
    # Optional fullscreen video expansion action button in header
    video:
      enabled: false
      stream_id: "chromecast"
      stream_url: "http://localhost:1984/api/webrtc?src=cast"
      control_url: "http://cast-watcher:8090/action"
      type: "webrtc"

  # Voice waveform mouth, driven by the ear daemon's real reply audio.
  # voice:
  #   waveform:
  #     enabled: true
  #     levels_url: "http://127.0.0.1:8765/levels"
  #     gain: 2.2

  # Active widget instances
  # Widgets are automatically packed across minimal rotation screens via the 6x2 bitmask solver.
  # No manual 'screens' or top-level 'providers' blocks are required.
  widgets:
    # Screen 1 Tiles (12 cells total: 4x2 + 2x1 + 2x1 = 12)
    - id: family-calendar
      type: calendar-feed
      dimensions: [4, 2]
      pinned: false
      refresh_interval_seconds: 300
      config:
        view: week
        calendars:
          - name: "Family Events"
            url_env: FAMILY_CALENDAR_URL # Resolved via host environment variable
            color: "#a855f7"

    - id: home-weather
      type: weather-forecast
      dimensions: [2, 1]
      pinned: false
      refresh_interval_seconds: 900
      config:
        latitude: 37.8044
        longitude: -122.2712
        units: imperial

    - id: household-tasks
      type: tasks
      dimensions: [2, 1]
      pinned: false
      refresh_interval_seconds: 300
      config:
        source: todoist
        list_id: family-chores
        todoist:
          project_name: "Family Chores"
          token_env: "TODOIST_API_TOKEN"

    # Screen 2 Tiles (12 cells total: 3x2 + 3x2 = 12)
    - id: living-room-photos
      type: photo-carousel
      dimensions: [3, 2]
      pinned: false
      refresh_interval_seconds: 3600
      config:
        share_url: "https://photos.app.goo.gl/AbCdEf123456789"
        cycle_interval_seconds: 60
        preload_count: 50
        shuffle: true

    # Conversation transcript (type chat-log; no endpoint, no database). The
    # voice hub records each turn per voice node; open the display with
    # ?node=<node_id> (e.g. /display?node=touch-kiosk-kitchen) so each device
    # shows its own conversation. Replace a spacer with:
    #   - id: voice-chat
    #     type: chat-log
    #     dimensions: [3, 2]

    - id: calendar-pad
      type: spacer
      dimensions: [3, 2]
      pinned: false

# In-memory chat-log store (all optional; nothing is written to disk and a
# restart starts empty). Defaults shown.
# chat_log:
#   ttl_minutes: 20
#   max_messages_per_node: 50

# Speaker identification. Optional: with
# this block absent, `speaker` is always empty. Uncomment and point
# embed_url at the voice-fingerprinter sidecar (deploy/compose.yml,
# profile "speaker-id") to enable it. Enroll speakers directly into config.yaml
# with `python3 sidecars/voice-fingerprinter/enroll.py <id> --wav <file>...
# --output deploy/config/config.yaml` and send SIGHUP to mirrormere-core.
# voice_hub:
#   enabled: true
#   stt_url: "tcp://localhost:10300"
#   brain_url: "http://localhost:8000/voice/ask"
#   tts_url: "http://localhost:8880/v1/audio/speech"
#   tts_voice: "af_bella"
#   tts_model: "kokoro"
#   speaker_id:
#     embed_url: "http://voice-fingerprinter:9096/embed"
#     model: "speechbrain/spkrec-ecapa-voxceleb"
#     speakers:
#       - id: "speaker-1"
#         embedding: [0.1, 0.2, 0.3]
#     threshold: 0.70      # optional, (0, 1]
#     timeout_seconds: 5   # optional
#   # Optional deterministic fast path: each transcript is POSTed as JSON
#   # {text, speaker, node, turn_id, tts:"none"} to this URL before the brain is asked.
#   # 204 (or any error/timeout) = no match, the brain answers as usual; 200
#   # text/event-stream = already executed, the hub speaks the sentences with its own TTS.
#   # Unset url = feature off (no call is made).
#   fast_path:
#     url: "http://hass-proxy:8095/intent"
#     timeout_ms: 800      # optional, default 800
