# Mirrormere Reference Configuration Template
# Authoritative Documentation: README.md, docs/decisions.md

# Server host and port bindings (restart required to apply changes)
host: "0.0.0.0"
port: 8080

# Authoritative household IANA timezone
timezone: "America/Los_Angeles"

# Device physical location (used for weather and day/night sunrise/sunset calculations)
location:
  name: "Oakland"
  latitude: 37.8044
  longitude: -122.2712

# Display and layout configuration
display:
  # Display shell served at /display: "react" (display_react.html + web/static/ui/app.js, default) or "legacy" (display.html).
  # The ?ui=react or ?ui=legacy query parameter overrides this per request.
  ui: "react"

  # Live canvas layout editing and atomic disk override file path (optional)
  allow_layout_edit: true
  layout_override_path: "/data/layout-override.yaml"

  # Visual theme mode: "auto" (switches at local sunrise/sunset), "day", or "night" (Sailor HG Fairyfloss)
  theme:
    mode: "auto"

  # Grid orientation: 6x2 (landscape default) or 2x6 (portrait)
  grid:
    columns: 6
    rows: 2

  rotation:
    interval_seconds: 30
    transition: "slide"

  # Persistent Fixed Header
  header:
    enabled: true
    elements:
      - clock
      - date
      - weather_badge
      - sync_status
    # Autonomous header weather poller hydrating header.update (inherits coordinates from location)
    weather:
      refresh_interval_seconds: 900
      units: imperial
    # Optional fullscreen video expansion action button in header
    video:
      enabled: false
      stream_id: "chromecast"
      stream_url: "http://localhost:1984/api/webrtc?src=cast"
      control_url: "http://cast-watcher:8090/action"
      type: "webrtc"

  # Voice waveform mouth, driven by the ear daemon's real reply audio.
  # voice:
  #   waveform:
  #     enabled: true
  #     levels_url: "http://127.0.0.1:8765/levels"
  #     gain: 2.2

  # Active widget instances
  # Widgets are automatically packed across minimal rotation screens via the 6x2 bitmask solver.
  # No manual 'screens' or top-level 'providers' blocks are required.
  widgets:
    # Screen 1 Tiles (12 cells total: 4x2 + 2x1 + 2x1 = 12)
    - id: family-calendar
      type: calendar-feed
      dimensions: [4, 2]
      pinned: false
      refresh_interval_seconds: 300
      config:
        view: week
        calendars:
          - name: "Family Events"
            url_env: FAMILY_CALENDAR_URL # Resolved via host environment variable
            color: "#a855f7"

    - id: home-weather
      type: weather-forecast
      dimensions: [2, 1]
      pinned: false
      refresh_interval_seconds: 900
      config:
        latitude: 37.8044
        longitude: -122.2712
        units: imperial

    - id: household-tasks
      type: tasks
      dimensions: [2, 1]
      pinned: false
      refresh_interval_seconds: 300
      config:
        source: todoist
        list_id: family-chores
        todoist:
          project_name: "Family Chores"
          token_env: "TODOIST_API_TOKEN"

    # Screen 2 Tiles (12 cells total: 3x2 + 3x2 = 12)
    - id: family-photos
      type: photo-carousel
      dimensions: [3, 2]
      pinned: false
      refresh_interval_seconds: 3600
      config:
        albums:
          - name: "Family Album"
            source: "share_url"
            url_env: "GOOGLE_PHOTOS_ALBUM_URL"

    # Conversation transcript (type chat-log; no endpoint, no database). The
    # voice hub records each turn per voice node; open the display with
    # ?node=<node_id> (e.g. /display?node=touch-kiosk-kitchen) so each device
    # shows its own conversation. Replace a spacer with:
    #   - id: voice-chat
    #     type: chat-log
    #     dimensions: [3, 2]

    - id: calendar-pad
      type: spacer
      dimensions: [3, 2]
      pinned: false

    # Camera Feeds Tiles (9-camera LiveView configuration: wider landscape tiles + tall portrait Doorbell on 3x6 grid = 18 cells)
    - id: cam-rosie
      type: live-view
      dimensions: [2, 1]
      pinned: false
      config:
        title: "Rosie Cam"
        stream_id: "rosie_cam"
        stream_url: "/hearth-api/cameras/rosie_cam/stream"
        stream_type: "mjpeg"
        poster_url: "/hearth-api/cameras/rosie_cam/snapshot"
        fit: "cover"
        expand_on_click: true
        expand_stream_url: "/hearth-api/cameras/rosie_cam/webrtc"
        expand_stream_type: "webrtc"
        refresh_interval_seconds: 15
        background_refresh_interval_seconds: 300
        stagger_index: 0

