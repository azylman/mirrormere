# deploy/compose.client.yaml - Mirrormere Client / Kiosk Manifest
# Deploys Edge Voice Ear client, go2rtc HDMI ingest daemon, and Cast Watcher sidecar.
# Reference: specs/001-architecture-overview.md, specs/002-hardware-profiles.md, & specs/004-video-cast-ingest.md

services:
  mirrormere-ear:
    build:
      context: ../clients/ear
      dockerfile: Dockerfile
    image: ghcr.io/azylman/mirrormere-ear:latest
    container_name: mirrormere-ear
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - MIRRORMERE_NODE_ID=${MIRRORMERE_NODE_ID:-touch-kiosk-kitchen}
      - MIRRORMERE_URL=${MIRRORMERE_URL:-http://192.168.1.14/kiosk}
      - MIRRORMERE_HUB_URL=${MIRRORMERE_HUB_URL:-http://192.168.1.14:9000/api/voice/interact}
      - MIRRORMERE_VOICE_CONFIG=/config/voice.yaml
      - MIRRORMERE_HEARTBEAT_FILE=/tmp/ear.heartbeat
    volumes:
      - ./config/voice.yaml:/config/voice.yaml:ro
      - ear-models:/opt/mirrormere/voice/models
    healthcheck:
      test: ["CMD-SHELL", "test $$(expr $$(date +%s) - $$(stat -c %Y /tmp/ear.heartbeat 2>/dev/null || echo 0)) -lt 30"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      start_interval: 2s
      retries: 3

  go2rtc:
    image: alexxit/go2rtc:v1.9.8
    container_name: mirrormere-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"       # WebRTC & HTTP REST API
      - "8555:8555/tcp"  # WebRTC TCP candidates
      - "8555:8555/udp"  # WebRTC UDP candidates
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    devices:
      - /dev/video0:/dev/video0  # MacroSilicon MS2130 USB capture card video
      - /dev/dri:/dev/dri        # Intel VAAPI/QSV hardware transcoding
      - /dev/snd:/dev/snd        # ALSA stereo audio capture
    group_add:
      - video
      - render
      - audio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1984/api"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      start_interval: 2s
      retries: 3

  cast-watcher:
    build:
      context: ..
      dockerfile: sidecars/cast-watcher/Dockerfile
    image: ghcr.io/azylman/mirrormere-cast-watcher:latest
    container_name: mirrormere-cast-watcher
    restart: unless-stopped
    network_mode: host
    environment:
      - CHROMECAST_ADDR=${CHROMECAST_ADDR:-192.168.1.50:8009}
      - CORE_URL=${CORE_URL:-http://192.168.1.14/kiosk}
      - STREAM_URL=${STREAM_URL:-http://localhost:1984/api/webrtc?src=cast}
      - CONTROL_PORT=${CONTROL_PORT:-8090}
      - CONTROL_URL=${CONTROL_URL:-http://localhost:8090/action}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      start_interval: 2s
      retries: 3

volumes:
  ear-models:
