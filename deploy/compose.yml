# deploy/compose.yml - Mirrormere Multi-Container Orchestration Manifest
# Reference: specs/001-architecture-overview.md & specs/002-hardware-profiles.md

services:
  mirrormere-core:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/azylman/mirrormere:latest
    container_name: mirrormere-core
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080" # Core Daemon: REST API, SSE (/api/events), web UI
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config:ro # Contains config.yaml, custom.css, and optional widgets/
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
