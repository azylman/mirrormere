# deploy/compose.yml - Mirrormere Multi-Container Orchestration Manifest
# Reference: specs/001-architecture-overview.md, specs/002-hardware-profiles.md, & specs/004-video-cast-ingest.md

services:
  mirrormere-core:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/azylman/mirrormere:latest
    container_name: mirrormere-core
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080" # Core Daemon: REST API, SSE (/api/events), web UI
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config:ro # Contains config.yaml, custom.css, and optional widgets/
      - ./data:/data
      - ../web:/app/web:ro
      - ../widgets:/app/widgets:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  go2rtc:
    profiles: ["video"]
    image: alexxit/go2rtc:latest
    container_name: mirrormere-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"       # WebRTC & HTTP REST API
      - "8555:8555/tcp"  # WebRTC TCP candidates
      - "8555:8555/udp"  # WebRTC UDP candidates
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    devices:
      - /dev/video0:/dev/video0  # MacroSilicon MS2130 USB capture card video
      - /dev/dri:/dev/dri        # Intel VAAPI/QSV hardware transcoding
      - /dev/snd:/dev/snd        # ALSA stereo audio capture
    group_add:
      - video
      - render
      - audio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1984/api"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  cast-watcher:
    profiles: ["video"]
    build:
      context: ..
      dockerfile: sidecars/cast-watcher/Dockerfile
    image: ghcr.io/azylman/mirrormere-cast-watcher:latest
    container_name: mirrormere-cast-watcher
    restart: unless-stopped
    ports:
      - "8090:8090" # Webhook action server & healthcheck
    environment:
      - CHROMECAST_ADDR=${CHROMECAST_ADDR:-192.168.1.50:8009}
      - CORE_URL=${CORE_URL:-http://mirrormere-core:8080}
      - STREAM_URL=${STREAM_URL:-http://localhost:1984/api/webrtc?src=cast}
      - CONTROL_PORT=${CONTROL_PORT:-8090}
      - CONTROL_URL=${CONTROL_URL:-http://cast-watcher:8090/action}
    depends_on:
      mirrormere-core:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  eink-renderer:
    profiles: ["eink"]
    build:
      context: ../sidecars/eink-renderer
      dockerfile: Dockerfile
    image: ghcr.io/azylman/mirrormere-eink-renderer:latest
    container_name: mirrormere-eink-renderer
    restart: unless-stopped
    ports:
      - "8081:8081" # E-Ink Snapshot server & ETag caching
    environment:
      - PORT=8081
      - CORE_URL=${CORE_URL:-http://mirrormere-core:8080}
      - DISPLAY_URL=${DISPLAY_URL:-http://mirrormere-core:8080/display}
    depends_on:
      mirrormere-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

