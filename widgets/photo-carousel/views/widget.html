<div class="widget-card widget-photo-carousel dither" data-widget-id="{{ .ID }}" data-widget-type="{{ .Type }}" data-fit="contain" style="grid-column: span {{ .Dimensions.Cols }}; grid-row: span {{ .Dimensions.Rows }};">
  {{ if .Data }}
    {{ if and .Data.Photos (gt (len .Data.Photos) 0) }}
      {{ $first := index .Data.Photos 0 }}
      <div class="photo-viewport dither">
        <div class="photo-backdrop-container" aria-hidden="true">
          <img class="photo-backdrop-layer photo-backdrop-current" src="{{ $first.URL }}=w96-h54-c" alt="" />
          <img class="photo-backdrop-layer photo-backdrop-next" src="" alt="" style="opacity: 0;" />
        </div>
        <div class="photo-foreground-container">
          <img class="photo-layer photo-current dither" src="{{ $first.URL }}=w3840-h2160" alt="Photo" />
          <img class="photo-layer photo-next dither" src="" alt="Photo" style="opacity: 0;" />
        </div>
      </div>
      <script type="application/json" class="photo-carousel-data">
        {{ jsonJS .Data }}
      </script>
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" style="display:none;" alt="" onload="window.MirrormerePhotoCarousel &amp;&amp; window.MirrormerePhotoCarousel.mount(this.closest('.widget-photo-carousel'))" />
    {{ else }}
      <div class="photo-empty">
        <span class="empty-icon">🖼️</span>
        <span class="empty-title">No photos in shared album</span>
      </div>
    {{ end }}
  {{ else }}
    <div class="photo-loading" style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--mm-text-dim, #8b819f); font-size: 0.95rem; font-weight: 700;">
      <span>Loading photos...</span>
    </div>
  {{ end }}
</div>
