name: photo-carousel
version: "1.0.0"
description: Google Photos shared album carousel with dynamic client-side edge sizing.
provider: photo-carousel

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [3, 2]

supported_dimensions:
  - [2, 1]
  - [3, 1]
  - [4, 1]
  - [2, 2]
  - [3, 2]
  - [4, 2]
  - [6, 2]
  - [1, 2]
  - [1, 3]
  - [1, 4]
  - [2, 3]
  - [2, 4]
  - [2, 6]

config_schema:
  type: object
  properties:
    cache_dir:
      type: string
    albums:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          source:
            type: string
            enum:
              - share_url
              - ember_bridge
          url:
            type: string
          url_env:
            type: string
        additionalProperties: false
    source:
      type: string
      enum:
        - share_url
        - ember_bridge
    album_url:
      type: string
      format: uri
    album_url_env:
      type: string
    share_url:
      type: string
    share_url_env:
      type: string
    cycle_interval_seconds:
      type: integer
      minimum: 1
    preload_count:
      type: integer
      minimum: 1
      maximum: 500
    shuffle:
      type: boolean
    fit:
      type: string
      enum: ["contain", "cover"]
    image_size:
      type: array
      items:
        type: integer
      minItems: 2
      maxItems: 2
  additionalProperties: false

response_schema:
  type: object
  required:
    - album_name
    - total_photos
    - photos
  properties:
    album_name:
      type: string
    album_url:
      type: string
    total_photos:
      type: integer
    photos:
      type: array
      items:
        type: object
        required:
          - id
          - url
          - aspect_ratio
        properties:
          id:
            type: string
          url:
            type: string
          timestamp:
            type: string
          aspect_ratio:
            type: number
          album_name:
            type: string
          location:
            type: string
          dominant_color:
            type: string
          location_checked:
            type: boolean
