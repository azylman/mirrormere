name: photo-carousel
version: "1.0.0"
description: Google Photos shared album carousel with dynamic client-side edge sizing.
provider: photo-carousel

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [3, 2]

supported_dimensions:
  - [2, 1]
  - [3, 1]
  - [4, 1]
  - [2, 2]
  - [3, 2]
  - [4, 2]
  - [6, 2]
  - [1, 2]
  - [1, 3]
  - [1, 4]
  - [2, 3]
  - [2, 4]
  - [2, 6]

config_schema:
  type: object
  required:
    - source
  properties:
    source:
      type: string
      enum:
        - share_url
        - ember_bridge
    album_url:
      type: string
      format: uri
    album_url_env:
      type: string
  additionalProperties: false

response_schema:
  type: object
  required:
    - album_name
    - total_photos
    - photos
  properties:
    album_name:
      type: string
    album_url:
      type: string
    total_photos:
      type: integer
    photos:
      type: array
      items:
        type: object
        required:
          - id
          - url
          - aspect_ratio
        properties:
          id:
            type: string
          url:
            type: string
          timestamp:
            type: string
          aspect_ratio:
            type: number
