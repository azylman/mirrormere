name: tasks
version: "1.0.0"
description: Ambient household checklist and tasks widget backed by local SQLite storage.
provider: tasks

capabilities:
  - ambient-static

default_dimensions: [2, 1]

supported_dimensions:
  - [2, 1]
  - [2, 2]
  - [3, 2]
  - [4, 1]
  - [4, 2]

config_schema:
  type: object
  properties:
    list_id:
      type: string
    list_name:
      type: string
    source:
      type: string
    show_completed:
      type: integer
      minimum: 0
    db_path:
      type: string
    gtasks:
      type: object
      properties:
        tasklist_id:
          type: string
        client_id:
          type: string
        client_id_env:
          type: string
        client_secret:
          type: string
        client_secret_env:
          type: string
        refresh_token:
          type: string
        refresh_token_env:
          type: string
        token:
          type: string
        token_env:
          type: string
        token_url:
          type: string
        base_url:
          type: string
      additionalProperties: false
    http:
      type: object
      properties:
        base_url:
          type: string
        token:
          type: string
        token_env:
          type: string
      additionalProperties: false
  additionalProperties: false
