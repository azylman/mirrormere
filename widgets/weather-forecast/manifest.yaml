name: weather-forecast
version: "1.0.0"
description: Ambient weather forecast card displaying current conditions, hourly timeline, and multi-day extended forecast.
provider: weather-forecast

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [2, 1]

supported_dimensions:
  - [2, 1]
  - [3, 1]
  - [2, 2]
  - [3, 2]
  - [4, 2]
  - [6, 2]
  - [1, 2]
  - [1, 3]
  - [2, 3]
  - [2, 4]
  - [2, 6]
  - [1, 4]
  - [3, 3]
  - [3, 4]
  - [3, 6]

config_schema:
  type: object
  required:
    - latitude
    - longitude
  properties:
    name:
      type: string
    location_name:
      type: string
    latitude:
      type: number
      minimum: -90
      maximum: 90
    longitude:
      type: number
      minimum: -180
      maximum: 180
    units:
      type: string
      enum:
        - imperial
        - metric
    mode:
      type: string
      enum:
        - standard
        - school-day
    character_pack:
      type: string
    variants_per_state:
      type: integer
      minimum: 1
      maximum: 10
    rain_threshold_pct:
      type: integer
      minimum: 0
      maximum: 100
    cold_max_f:
      type: number
    cool_max_f:
      type: number
    warm_max_f:
      type: number
  additionalProperties: false
