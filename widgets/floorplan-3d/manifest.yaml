name: floorplan-3d
version: "1.0.0"
description: Interactive 3D architectural floorplan widget with camera presets and Home Assistant entity bindings.
provider: spacer

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [4, 2]

supported_dimensions:
  - [1, 2]
  - [2, 2]
  - [3, 2]
  - [4, 2]
  - [6, 2]
  - [1, 3]
  - [1, 4]
  - [2, 3]
  - [2, 4]
  - [2, 6]
  - [3, 3]
  - [3, 4]
  - [3, 6]

config_schema:
  type: object
  additionalProperties: true
  properties:
    title:
      type: string
    layout_url:
      type: string
    layoutUrl:
      type: string
    layout:
      type:
        - object
        - string
    defaultFloorId:
      type: string
    defaultPresetId:
      type: string
    floors:
      type: array
    cameraPresets:
      type: array
    haBindings:
      type: array
