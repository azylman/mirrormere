name: live-view
version: "1.0.0"
description: Live video stream tile with one-tap expansion into fullscreen presentation mode.
provider: live-view

capabilities:
  - touch-interactive

default_dimensions: [3, 2]

supported_dimensions:
  - [2, 1]
  - [3, 1]
  - [4, 1]
  - [2, 2]
  - [3, 2]
  - [4, 2]
  - [6, 2]
  - [1, 2]
  - [1, 3]
  - [1, 4]
  - [2, 3]
  - [2, 4]
  - [2, 6]
  - [3, 3]
  - [3, 4]
  - [3, 6]

config_schema:
  type: object
  required:
    - stream_url
  properties:
    stream_url:
      type: string
      description: URL of the live stream for the widget tile (WebRTC endpoint or MJPEG).
    stream_type:
      type: string
      enum: ["webrtc", "mjpeg", "hls"]
      description: Stream format for the widget tile. Defaults to 'webrtc' if omitted.
    fit:
      type: string
      enum: ["contain", "cover"]
      description: Video scaling mode in ambient widget tile. Defaults to 'contain'.
    title:
      type: string
      description: Optional overlay title displayed in the corner of the tile.
    poster_url:
      type: string
      description: Snapshot image URL for the initial poster frame shown before the stream connects.
    expand_on_click:
      type: boolean
      description: Whether tapping the widget expands into fullscreen video mode. Defaults to true.
    stream_id:
      type: string
      description: Stream ID for the priority stack. Defaults to widget ID.
    priority:
      type: string
      enum: ["persistent", "temporary"]
      description: Priority tier in video stack ('persistent' for media, 'temporary' for alert cams). Defaults to 'persistent'.
    timeout_seconds:
      type: integer
      minimum: 1
      description: Auto-dismiss timeout for temporary streams. Core defaults to 45s if omitted. Ignored for persistent streams.
    controllable:
      type: boolean
      description: Whether the stream supports transport controls (play/pause) when expanded. Defaults to false.
    control_url:
      type: string
      description: Webhook URL on stream sidecar where Core forwards transport actions.
    expand_stream_url:
      type: string
      description: Optional override stream URL for fullscreen presentation. Defaults to stream_url.
    expand_stream_type:
      type: string
      enum: ["webrtc", "mjpeg", "hls"]
      description: Optional override stream format for fullscreen presentation. Defaults to stream_type.
    auto_live_on_motion_seconds:
      type: integer
      minimum: 1
      description: Duration in seconds to automatically promote the tile to live video after motion is detected.
    max_auto_live_streams:
      type: integer
      minimum: 1
      description: Maximum number of camera tiles allowed to auto-stream live video concurrently.
    battery_powered:
      type: boolean
      description: Whether the camera is battery-powered, disabling continuous live streaming.
    refresh_interval_seconds:
      type: integer
      minimum: 0
      description: Snapshot refresh interval in seconds when visible on the active screen.
    background_refresh_interval_seconds:
      type: integer
      minimum: 0
      description: Snapshot refresh interval in seconds when on a background screen; 0 disables background polling.
    stagger_index:
      type: integer
      minimum: 0
      description: 0-based stagger slot index offsetting snapshot refreshes across camera tiles.
    idle_timeout_seconds:
      type: integer
      minimum: 1
      description: Timeout in seconds before an idle live stream falls back to snapshot mode.
  additionalProperties: false
