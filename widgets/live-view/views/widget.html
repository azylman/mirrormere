<div class="widget-card widget-live-view dither" data-widget-id="{{ .ID }}" data-widget-type="{{ .Type }}" style="grid-column: span {{ .Dimensions.Cols }}; grid-row: span {{ .Dimensions.Rows }}; position: relative; overflow: hidden; padding: 0; background: #000; border: none; border-radius: 8px; cursor: pointer; user-select: none; -webkit-user-select: none;">
  <div class="live-view-viewport" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    {{ if eq .Config.stream_type "mjpeg" }}
      <img class="live-view-media live-view-mjpeg" src="{{ .Config.stream_url }}" alt="{{ if .Config.title }}{{ .Config.title }}{{ else }}Live View{{ end }}" style="width: 100%; height: 100%; object-fit: {{ if eq .Config.fit "cover" }}cover{{ else }}contain{{ end }};" />
    {{ else }}
      <video class="live-view-media live-view-video" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: {{ if eq .Config.fit "cover" }}cover{{ else }}contain{{ end }};"></video>
    {{ end }}

    {{ if .Config.poster_url }}
      <img class="live-view-poster" src="{{ .Config.poster_url }}" alt="Poster" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: {{ if eq .Config.fit "cover" }}cover{{ else }}contain{{ end }}; display: none;" />
    {{ end }}

    <div class="live-view-overlay" style="position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span class="live-view-title" style="font-size: 0.8rem; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); letter-spacing: 0.03em;">
          {{ if .Config.title }}{{ .Config.title }}{{ else }}Live View{{ end }}
        </span>
        <span class="live-view-badge" style="font-size: 0.65rem; font-family: var(--mm-font-mono, monospace); color: #4ade80; background: rgba(74, 222, 128, 0.15); padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(74, 222, 128, 0.3);">LIVE</span>
      </div>
      <div class="live-view-expand-hint" style="align-self: flex-end; opacity: 0.8;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </div>
    </div>
  </div>

  <script type="application/json" class="live-view-config">
    {{ json .Config }}
  </script>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" style="display:none;" alt="" onload="window.MirrormereLiveView &amp;&amp; window.MirrormereLiveView.mount(this.closest('.widget-live-view'))" />
</div>
