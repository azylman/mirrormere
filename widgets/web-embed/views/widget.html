<div class="widget-card widget-web-embed" data-widget-id="{{ .ID }}" data-widget-type="{{ .Type }}" style="grid-column: span {{ .Dimensions.Cols }}; grid-row: span {{ .Dimensions.Rows }}; display: flex; flex-direction: column; overflow: hidden; padding: 0; border-radius: 12px;">
  <div class="web-embed-header" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: rgba(15, 23, 42, 0.55); border-bottom: 1px solid rgba(255, 255, 255, 0.1); touch-action: pan-x; user-select: none;">
    <span style="font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em; opacity: 0.9;">
      {{ if .Config.title }}{{ .Config.title }}{{ else }}Home Assistant{{ end }}
    </span>
    <span style="font-size: 0.72rem; opacity: 0.65;">Swipe bar to turn page</span>
  </div>
  <iframe
    src="{{ .Config.url }}"
    title="{{ if .Config.title }}{{ .Config.title }}{{ else }}Embedded Dashboard{{ end }}"
    style="flex: 1; width: 100%; height: 100%; border: 0; background: transparent;"
    allow="fullscreen; autoplay"
    loading="lazy">
  </iframe>
</div>
