name: calendar-feed
version: "1.0.0"
description: Chronological calendar feed widget displaying upcoming events across synchronized iCal feeds.
provider: calendar-feed

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [4, 2]

supported_dimensions:
  - [2, 1]
  - [2, 2]
  - [3, 2]
  - [4, 1]
  - [4, 2]
  - [6, 1]
  - [6, 2]

config_schema:
  type: object
  properties:
    view:
      type: string
    strip_recurring:
      type: boolean
    exclude_recurring:
      type: boolean
    calendars:
      type: array
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          type:
            type: string
            enum:
              - ical
              - caldav
          url:
            type: string
          url_env:
            type: string
          color:
            type: string
          enabled:
            type: boolean
          strip_recurring:
            type: boolean
          exclude_recurring:
            type: boolean
          username:
            type: string
          username_env:
            type: string
          password:
            type: string
          password_env:
            type: string
          token:
            type: string
          token_env:
            type: string
        additionalProperties: false
  additionalProperties: false
